name: course-c-practice02
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: practice02
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: ${LAB_DB_ADMIN_PASSWORD:?Run npm run db:up to generate disposable credentials}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      LAB_DB_READER_PASSWORD: ${LAB_DB_READER_PASSWORD:?Run npm run db:up}
      LAB_DB_REPORTER_PASSWORD: ${LAB_DB_REPORTER_PASSWORD:?Run npm run db:up}
    ports:
      - "127.0.0.1:${LAB_DB_PORT:-55432}:5432"
    volumes:
      - practice02-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d practice02"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 150
    shm_size: 64m
    security_opt:
      - no-new-privileges:true
    restart: "no"
volumes:
  practice02-postgres:
    name: course-c-practice02-postgres
