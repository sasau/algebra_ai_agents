<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Four numbered events show that four CPU tasks share two illustrative CPU slots, so virtual threads do not create cores, and checksums are compared before elapsed time is interpreted." font-family="Inter,sans-serif"><defs><marker id="cpu-arrow-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="24" y="28" font-size="22" font-weight="700" fill="#1A1A2E">Illustrative machine: 2 CPU slots, 4 computing tasks</text><g stroke="#B8B8C8" stroke-width="2"><rect x="24" y="46" width="208" height="248" rx="14" fill="#F0EDFF" /><rect x="252" y="46" width="208" height="248" rx="14" fill="#E6F4FF" /><rect x="480" y="46" width="208" height="248" rx="14" fill="#E6FAF3" /><rect x="708" y="46" width="208" height="248" rx="14" fill="#FFF4ED" /></g><g stroke="#1A1A2E" stroke-width="2" marker-end="url(#cpu-arrow-pjava02)"><path d="M234,170H250" /><path d="M462,170H478" /><path d="M690,170H706" /></g><g font-size="20" font-weight="700" fill="#1A1A2E"><circle cx="54" cy="76" r="16" fill="#1A1A2E" /><circle cx="282" cy="76" r="16" fill="#1A1A2E" /><circle cx="510" cy="76" r="16" fill="#1A1A2E" /><circle cx="738" cy="76" r="16" fill="#1A1A2E" /><text x="78" y="83">Prepare</text><text x="306" y="83">Run A+B</text><text x="534" y="83">Reuse slots</text><text x="762" y="83">Collect</text></g><g font-size="18" font-weight="700" fill="#1A1A2E" text-anchor="middle"><text x="54" y="82" fill="#FAFAFE">1</text><text x="282" y="82" fill="#FAFAFE">2</text><text x="510" y="82" fill="#FAFAFE">3</text><text x="738" y="82" fill="#FAFAFE">4</text>
<g fill="#FAFAFE" stroke="#7B61FF" stroke-width="2"><rect x="38" y="112" width="36" height="36" rx="8" /><rect x="84" y="112" width="36" height="36" rx="8" /><rect x="130" y="112" width="36" height="36" rx="8" /><rect x="176" y="112" width="36" height="36" rx="8" /></g><text x="56" y="137">A</text><text x="102" y="137">B</text><text x="148" y="137">C</text><text x="194" y="137">D</text>
