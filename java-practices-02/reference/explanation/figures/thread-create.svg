<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="Java Thread creation: selected declarations of Thread and its constructor, example statements that create an unstarted worker thread and then start it, and the equivalent builder that also needs a separate start call." font-family="Inter,sans-serif"><defs><marker id="thread-create-arr-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E" /></marker></defs><rect width="940" height="360" fill="#FAFAFE" /><text x="20" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Selected Java 21 API excerpts</text><rect x="20" y="42" width="440" height="108" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><g font-family="monospace" font-size="18" fill="#1A1A2E"><text x="34" y="68">public class Thread</text><text x="34" y="90">    implements Runnable { ... }</text><text x="34" y="122">public Thread(Runnable target,</text><text x="34" y="144">              String name)</text></g><circle cx="445" cy="62" r="12" fill="#1A1A2E" /><text x="445" y="68" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">A</text><text x="20" y="176" font-size="18" fill="#5B41DF" font-weight="700">A Thread = class · constructor: NO return type</text><text x="20" y="198" font-size="18" fill="#1A1A2E">target = Runnable task · name = thread label</text><text x="20" y="226" font-size="20" font-weight="700" fill="#1A1A2E">Example statements (task already defined)</text><rect x="20" y="238" width="440" height="72" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><g font-family="monospace" font-size="18" fill="#1A1A2E"><text x="34" y="262">Thread worker =</text><text x="34" y="284">    new Thread(task, "lesson-worker");</text><text x="34" y="306">worker.start();</text></g><text x="490" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Runtime events</text><rect x="490" y="42" width="430" height="62" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><circle cx="516" cy="73" r="14" fill="#1A1A2E" /><text x="516" y="80" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">1</text><text x="542" y="68" font-size="18" fill="#1A1A2E">task: Runnable supplied</text><text x="542" y="92" font-size="18" fill="#1A1A2E">(work defined; not executed)</text><rect x="490" y="124" width="430" height="82" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><circle cx="516" cy="155" r="14" fill="#1A1A2E" /><text x="516" y="162" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">2</text><text x="542" y="150" font-size="18" fill="#1A1A2E">worker → Thread object, NEW</text><text x="542" y="173" font-size="18" fill="#1A1A2E">name "lesson-worker"; no body run</text><text x="542" y="196" font-size="18" fill="#008866">worker stores the reference</text><rect x="490" y="226" width="430" height="62" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="516" cy="257" r="14" fill="#1A1A2E" /><text x="516" y="264" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">3</text><text x="542" y="252" font-size="18" fill="#1A1A2E">worker.start(): new thread</text><text x="542" y="276" font-size="18" fill="#1A1A2E">runs task.run(); start once</text><path d="M705 105V122" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#thread-create-arr-pjava02)" /><rect x="490" y="302" width="430" height="50" rx="10" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><g font-family="monospace" font-size="18" fill="#1A1A2E"><text x="500" y="322" font-size="18">Thread.ofPlatform().name(</text><text x="500" y="343" font-size="18">    "lesson-worker").unstarted(task);</text></g><text x="20" y="342" font-size="18" fill="#008866" font-weight="700">Builder: unstarted platform thread; call start()</text><path d="M705 207V224" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#thread-create-arr-pjava02)" /></svg>