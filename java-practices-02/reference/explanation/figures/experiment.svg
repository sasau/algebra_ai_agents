<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Six-step experiment pipeline: prepare 120 tasks outside the timer, warm up, rotate mode order over five rounds, time execution plus cleanup, validate count and checksum before accepting, then take medians." font-family="Inter,sans-serif"><defs><marker id="experiment-ar-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="26" font-size="21" font-weight="700" fill="#1A1A2E">Experiment: timed region is run + cleanup only</text><g fill="#1A1A2E" font-size="18"><rect x="14" y="44" width="292" height="128" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="38" cy="68" r="14" fill="#1A1A2E" /><text x="38" y="75" text-anchor="middle" font-weight="700" fill="#FAFAFE">1</text><text x="62" y="75" font-weight="700">Prepare input</text><text x="26" y="106">Same 120 task inputs</text><text x="26" y="128">wait 20ms or 50,000 loop</text><text x="26" y="150" font-weight="700" fill="#0066BB">OUTSIDE timer</text><rect x="324" y="44" width="292" height="128" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="348" cy="68" r="14" fill="#1A1A2E" /><text x="348" y="75" text-anchor="middle" font-weight="700" fill="#FAFAFE">2</text><text x="372" y="75" font-weight="700">Warm up</text><text x="336" y="106">3 rounds × 4 modes</text><text x="336" y="128">0 samples recorded</text><text x="336" y="150" fill="#5B41DF" font-weight="700">no timing kept</text><rect x="634" y="44" width="292" height="128" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="658" cy="68" r="14" fill="#1A1A2E" /><text x="658" y="75" text-anchor="middle" font-weight="700" fill="#FAFAFE">3</text><text x="682" y="75" font-weight="700">Rotate order</text><text x="646" y="106">5 measured rounds ↻</text><text x="646" y="128">seq · pool8 · plat/task</text><text x="646" y="150">· virtual/task, shifted</text><rect x="14" y="186" width="292" height="128" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="4" /><circle cx="38" cy="210" r="14" fill="#1A1A2E" /><text x="38" y="217" text-anchor="middle" font-weight="700" fill="#FAFAFE">4</text><text x="62" y="217" font-weight="700">Timed run</text><text x="26" y="246">start timer, start tasks</text><text x="26" y="268">await all, close executor</text><text x="26" y="290">stop timer</text><text x="294" y="217" text-anchor="end" font-weight="700" fill="#C44E00">⏱</text><rect x="324" y="186" width="292" height="128" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><circle cx="348" cy="210" r="14" fill="#1A1A2E" /><text x="348" y="217" text-anchor="middle" font-weight="700" fill="#FAFAFE">5</text><text x="372" y="217" font-weight="700">Validate sample</text><text x="336" y="246">completed == 120 ?</text><text x="336" y="268">same checksum? else reject</text><text x="336" y="290" fill="#008866" font-weight="700">print OUTSIDE timer</text><rect x="634" y="186" width="292" height="128" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><circle cx="658" cy="210" r="14" fill="#1A1A2E" /><text x="658" y="217" text-anchor="middle" font-weight="700" fill="#FAFAFE">6</text><text x="682" y="217" font-weight="700">Median per mode</text><text x="646" y="246">median of 5 accepted</text><text x="646" y="268">4 modes, 4 medians</text><text x="646" y="290" fill="#008866" font-weight="700">real observations</text></g><g stroke="#1A1A2E" stroke-width="2" fill="none" marker-end="url(#experiment-ar-pjava02)"><path d="M306 108H322" /><path d="M616 108H632" /><path d="M780 172V179H160V184" /><path d="M306 250H322" /><path d="M616 250H632" /></g></svg>