<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" role="img" aria-label="Two panels compare CyclicBarrier(2), where two workers wait at a reusable gate between reads and writes, with CountDownLatch(2), where two countDown calls take the count from 2 to 0 and release a waiting caller once." font-family="Inter,sans-serif" font-size="18" fill="#1A1A2E"><defs><marker id="rendezvous-parts-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="310" fill="#FAFAFE"/><rect x="10" y="8" width="450" height="294" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="26" y="36" font-size="21" font-weight="700" fill="#C44E00">CyclicBarrier(2)</text><text x="26" y="58" fill="#1A1A2E">reusable phase rendezvous</text><rect x="26" y="72" width="100" height="40" rx="8" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="76" y="98" text-anchor="middle">A read 0</text><rect x="26" y="132" width="100" height="40" rx="8" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="76" y="158" text-anchor="middle">B read 0</text><text x="140" y="86">await, waits</text><line x1="128" y1="92" x2="244" y2="92" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><text x="140" y="146">await → 2/2</text><line x1="128" y1="152" x2="244" y2="152" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><rect x="248" y="68" width="14" height="110" rx="4" fill="#FF6200"/><text x="255" y="198" text-anchor="middle" font-weight="700" fill="#C44E00">gate</text><line x1="264" y1="92" x2="320" y2="92" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><line x1="264" y1="152" x2="320" y2="152" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><rect x="324" y="72" width="120" height="40" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="384" y="98" text-anchor="middle">A write</text><rect x="324" y="132" width="120" height="40" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="384" y="158" text-anchor="middle">B write</text><text x="26" y="228">Parties: 2 peers · wait: await()</text><text x="26" y="252">Release: 2nd await frees both</text><text x="26" y="276">Reusable: next phase repeats</text><text x="26" y="296">No sleeps; no FIFO promise</text><rect x="480" y="8" width="450" height="294" rx="14" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="496" y="36" font-size="21" font-weight="700" fill="#5B41DF">CountDownLatch(2)</text><text x="496" y="58">one-shot completion signals</text><rect x="494" y="72" width="136" height="50" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="562" y="94" text-anchor="middle">A countDown</text><text x="562" y="114" text-anchor="middle">2→1</text><rect x="494" y="132" width="136" height="50" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="562" y="154" text-anchor="middle">B countDown</text><text x="562" y="174" text-anchor="middle">1→0</text><line x1="632" y1="97" x2="676" y2="115" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><line x1="632" y1="157" x2="676" y2="139" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><rect x="680" y="92" width="100" height="70" rx="10" fill="#FAFAFE" stroke="#7B61FF" stroke-width="2"/><text x="730" y="118" text-anchor="middle">count</text><text x="730" y="144" text-anchor="middle" font-weight="700">2→1→0</text><line x1="782" y1="127" x2="822" y2="127" stroke="#1A1A2E" stroke-width="2" marker-end="url(#rendezvous-parts-ar-pjava02)"/><rect x="826" y="92" width="92" height="70" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="872" y="118" text-anchor="middle">caller</text><text x="872" y="144" text-anchor="middle">await</text><text x="496" y="206">Parties: 2 counts · wait: await()</text><text x="496" y="230">Release: count reaches 0</text><text x="496" y="254">One-shot: cannot reset</text><text x="496" y="278">Done ≠ success: observe results</text><text x="496" y="298">or exceptions separately</text></svg>