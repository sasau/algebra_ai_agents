<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Left: thread P holds appLock while put B waits on a full one-slot queue, and thread C is blocked outside appLock before it can take A, forming a deadlock. Right: without the external lock, C takes A, space opens, and P inserts B." font-family="Inter,sans-serif">
<defs>
<marker id="queue-outer-lock-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker>
<marker id="queue-outer-lock-ao-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#C44E00"/></marker>
</defs>
<rect width="940" height="330" fill="#FAFAFE"/>
<rect x="10" y="8" width="445" height="314" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/>
<rect x="485" y="8" width="445" height="314" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/>
<text x="28" y="36" font-size="21" font-weight="700" fill="#1A1A2E">Before: outer lock deadlock</text>
<text x="503" y="36" font-size="21" font-weight="700" fill="#1A1A2E">After: no outer lock</text>

<rect x="28" y="52" width="180" height="62" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/>
<text x="42" y="78" font-size="18" fill="#1A1A2E">ThreadP</text>
<text x="42" y="102" font-size="18" fill="#1A1A2E">put(B) waits</text>
<rect x="250" y="52" width="190" height="62" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/>
<text x="264" y="78" font-size="18" fill="#1A1A2E">ThreadC</text>
<text x="264" y="102" font-size="18" fill="#1A1A2E">BLOCKED outside</text>

<rect x="28" y="150" width="180" height="48" rx="10" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/>
<text x="42" y="181" font-size="18" fill="#1A1A2E">appLock: P owns</text>
<path d="M118 114V148" stroke="#C44E00" stroke-width="2.5" marker-end="url(#queue-outer-lock-ao-pjava02)"/>
<path d="M345 114V160H210" fill="none" stroke="#C44E00" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#queue-outer-lock-ao-pjava02)"/>
<text x="355" y="144" font-size="18" fill="#1A1A2E">needs</text>

<rect x="250" y="176" width="190" height="60" rx="10" fill="#FAFAFE" stroke="#7A7A8A" stroke-width="2"/>
<text x="262" y="200" font-size="18" fill="#1A1A2E">queue cap 1: [A]</text>
<text x="262" y="224" font-size="18" fill="#1A1A2E">internal lock free</text>
<path d="M70 114Q60 250 250 222" fill="none" stroke="#1A1A2E" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#queue-outer-lock-ar-pjava02)"/>
<text x="28" y="266" font-size="18" fill="#1A1A2E">P needs C to take A;</text>
<text x="28" y="292" font-size="18" fill="#1A1A2E">C needs appLock. Queue works.</text>
<circle cx="236" cy="82" r="11" fill="#1A1A2E"/><text x="236" y="88" font-size="18" text-anchor="middle" fill="#FAFAFE">1</text>
<circle cx="236" cy="228" r="11" fill="#1A1A2E"/><text x="236" y="234" font-size="18" text-anchor="middle" fill="#FAFAFE">2</text>

<rect x="503" y="52" width="180" height="62" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/>
<text x="517" y="78" font-size="18" fill="#1A1A2E">ThreadP</text>
<text x="517" y="102" font-size="18" fill="#1A1A2E">put(B)</text>
<rect x="725" y="52" width="190" height="62" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/>
<text x="739" y="78" font-size="18" fill="#1A1A2E">ThreadC</text>
<text x="739" y="102" font-size="18" fill="#1A1A2E">take() A</text>
<circle cx="709" cy="82" r="11" fill="#1A1A2E"/><text x="709" y="88" font-size="18" text-anchor="middle" fill="#FAFAFE">3</text>

<text x="503" y="154" font-size="18" fill="#1A1A2E">buffer:</text>
<rect x="580" y="130" width="70" height="36" rx="6" fill="#FAFAFE" stroke="#1A1A2E" stroke-width="2"/><text x="615" y="155" font-size="18" text-anchor="middle" fill="#1A1A2E">[A]</text>
<rect x="680" y="130" width="90" height="36" rx="6" fill="#FAFAFE" stroke="#7A7A8A" stroke-width="2"/><text x="725" y="155" font-size="18" text-anchor="middle" fill="#1A1A2E">empty</text>
<rect x="800" y="130" width="70" height="36" rx="6" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="835" y="155" font-size="18" text-anchor="middle" fill="#1A1A2E">[B]</text>
<path d="M651 148H678" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#queue-outer-lock-ar-pjava02)"/><path d="M771 148H798" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#queue-outer-lock-ar-pjava02)"/>
<circle cx="665" cy="122" r="11" fill="#1A1A2E"/><text x="665" y="128" font-size="18" text-anchor="middle" fill="#FAFAFE">4</text>
<circle cx="785" cy="122" r="11" fill="#1A1A2E"/><text x="785" y="128" font-size="18" text-anchor="middle" fill="#FAFAFE">5</text>
<text x="503" y="200" font-size="18" fill="#1A1A2E">3 C takes A. 4 space opens.</text>
<text x="503" y="226" font-size="18" fill="#1A1A2E">5 P inserts B.</text>
<text x="503" y="262" font-size="18" fill="#1A1A2E">Need a time budget? offer/poll</text>
<text x="503" y="288" font-size="18" fill="#1A1A2E">with timeout; handle false/null,</text>
<text x="503" y="312" font-size="18" fill="#1A1A2E">never silently drop B.</text>
</svg>