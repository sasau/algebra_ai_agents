<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Left: a barrier expecting two parties waits forever when worker B fails before arriving, and a latch stays at count one when countDown is forgotten. Right: timed await breaks the barrier and reports failures, while countDown in finally and Future.get separate signalling from success." font-family="Inter,sans-serif"><defs><marker id="rendezvous-failure-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="20" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Missing participant: wait with a time limit</text><rect x="14" y="40" width="440" height="276" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><rect x="486" y="40" width="440" height="276" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="30" y="68" font-size="18" font-weight="700" fill="#C44E00">Failure: one arrival is missing</text><text x="502" y="68" font-size="18" font-weight="700" fill="#008866">Repair: limit the wait</text><rect x="30" y="82" width="408" height="104" rx="10" fill="#FAFAFE" stroke="#B8B8C8"/><text x="68" y="106" font-size="18" fill="#1A1A2E">Barrier expects 2</text><text x="68" y="132" font-size="18" fill="#1A1A2E">A: await() waits</text><text x="68" y="158" font-size="18" fill="#1A1A2E">B: fails BEFORE arriving</text><text x="68" y="180" font-size="18" fill="#C44E00">Untimed A waits indefinitely</text><rect x="30" y="198" width="408" height="104" rx="10" fill="#FAFAFE" stroke="#B8B8C8"/><text x="68" y="224" font-size="18" fill="#1A1A2E">Latch starts at 2</text><text x="68" y="252" font-size="18" fill="#1A1A2E">Worker forgets countDown()</text><text x="68" y="280" font-size="18" fill="#C44E00">Count stays 1: await blocked</text><g fill="#1A1A2E"><circle cx="46" cy="102" r="11"/><circle cx="46" cy="128" r="11"/><circle cx="46" cy="154" r="11"/><circle cx="46" cy="220" r="11"/><circle cx="46" cy="248" r="11"/></g><g font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle"><text x="46" y="107">1</text><text x="46" y="133">2</text><text x="46" y="159">3</text><text x="46" y="225">4</text><text x="46" y="253">5</text></g><rect x="502" y="82" width="408" height="104" rx="10" fill="#FAFAFE" stroke="#B8B8C8"/><text x="518" y="108" font-size="18" fill="#1A1A2E">await(timeout) times out</text><text x="518" y="134" font-size="18" fill="#1A1A2E">Barrier is broken</text><text x="518" y="160" font-size="18" fill="#1A1A2E">Others: BrokenBarrierException</text><text x="518" y="180" font-size="18" fill="#008866">Check task failures; clean up</text><rect x="502" y="198" width="408" height="104" rx="10" fill="#FAFAFE" stroke="#B8B8C8"/><text x="518" y="224" font-size="18" fill="#1A1A2E">finally { countDown(); }</text><text x="518" y="250" font-size="18" fill="#1A1A2E">Timed await guards caller</text><text x="518" y="276" font-size="18" fill="#1A1A2E">Future.get(): success/failure</text><text x="518" y="297" font-size="18" fill="#C44E00">Timeout ≠ work completed</text><path d="M440 134H494" stroke="#1A1A2E" stroke-width="3" marker-end="url(#rendezvous-failure-ar-pjava02)"/><path d="M440 250H494" stroke="#1A1A2E" stroke-width="3" marker-end="url(#rendezvous-failure-ar-pjava02)"/></svg>