<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 300" role="img" aria-label="Two threads A and B point to the same shared AtomicInteger holding count 0. Three API cards explain get, set and incrementAndGet, and a four-step trace shows each incrementAndGet call as one atomic step, taking the shared value from 0 to 1 and then 2." font-family="Inter,sans-serif"><defs><marker id="atomic-parts-arrow-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="300" fill="#FAFAFE"/><text x="20" y="26" font-size="21" font-weight="700" fill="#1A1A2E">AtomicInteger: one shared object, one-call updates</text><rect x="30" y="44" width="80" height="40" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="70" y="71" font-size="18" font-weight="700" text-anchor="middle" fill="#1A1A2E">A</text><rect x="210" y="44" width="80" height="40" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="250" y="71" font-size="18" font-weight="700" text-anchor="middle" fill="#1A1A2E">B</text><path d="M70 86L110 128" stroke="#1A1A2E" stroke-width="2.5" fill="none" marker-end="url(#atomic-parts-arrow-pjava02)"/><path d="M250 86L210 128" stroke="#1A1A2E" stroke-width="2.5" fill="none" marker-end="url(#atomic-parts-arrow-pjava02)"/><rect x="30" y="132" width="260" height="118" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="160" y="159" font-size="18" font-weight="700" text-anchor="middle" fill="#1A1A2E">AtomicInteger</text><rect x="70" y="170" width="180" height="40" rx="20" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="160" y="197" font-size="18" text-anchor="middle" fill="#1A1A2E">count = 0</text><text x="160" y="236" font-size="18" text-anchor="middle" fill="#1A1A2E">same shared object</text><rect x="315" y="44" width="285" height="62" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="331" y="70" font-size="18" font-weight="700" fill="#1A1A2E">get()</text><text x="331" y="94" font-size="18" fill="#1A1A2E">reads one current value</text><rect x="315" y="116" width="285" height="62" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="331" y="142" font-size="18" font-weight="700" fill="#1A1A2E">set(n)</text><text x="331" y="166" font-size="18" fill="#1A1A2E">replaces one value</text><rect x="315" y="188" width="285" height="62" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="331" y="214" font-size="18" font-weight="700" fill="#1A1A2E">incrementAndGet()</text><text x="331" y="238" font-size="18" fill="#1A1A2E">indivisible +1, returns new</text><rect x="615" y="44" width="305" height="48" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><circle cx="639" cy="68" r="13" fill="#1A1A2E"/><text x="639" y="74" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">1</text><text x="662" y="75" font-size="18" fill="#1A1A2E">A calls incrementAndGet()</text><rect x="615" y="98" width="305" height="48" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="3" stroke-dasharray="8 4"/><circle cx="639" cy="122" r="13" fill="#1A1A2E"/><text x="639" y="128" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">2</text><text x="662" y="129" font-size="18" fill="#1A1A2E">0 → 1, return 1 to A</text><rect x="615" y="152" width="305" height="48" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="3" stroke-dasharray="8 4"/><circle cx="639" cy="176" r="13" fill="#1A1A2E"/><text x="639" y="182" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">3</text><text x="662" y="183" font-size="18" fill="#1A1A2E">B: 1 → 2, return 2</text><rect x="615" y="206" width="305" height="44" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><circle cx="639" cy="228" r="13" fill="#1A1A2E"/><text x="639" y="234" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">4</text><text x="662" y="235" font-size="18" fill="#1A1A2E">Both done: final 2</text><rect x="20" y="260" width="900" height="32" rx="10" fill="#1A1A2E"/><text x="470" y="283" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">One method call can be atomic; several calls are not a transaction.</text></svg>