<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" role="img" aria-label="Four Java 21 Thread method contracts: join waits a bounded time without stopping the target, interrupt requests cooperative cancellation, isAlive observes liveness, and isInterrupted reads interrupt status without clearing it." font-family="Inter,sans-serif"><defs><marker id="thread-wait-cancel-arrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E" /></marker></defs><rect width="940" height="360" fill="#FAFAFE" /><text x="20" y="26" font-size="20" font-weight="700" fill="#1A1A2E">Thread: selected declarations</text><rect x="14" y="38" width="454" height="124" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="28" y="64" font-size="18" font-family="monospace" fill="#1A1A2E">① public final void join(long millis)</text><text x="52" y="86" font-size="18" font-family="monospace" fill="#1A1A2E">throws InterruptedException;</text><text x="28" y="110" font-size="18" fill="#1A1A2E">Waits for up to millis &gt; 0.</text><text x="28" y="132" font-size="18" fill="#1A1A2E">May return before worker ends;</text><text x="28" y="154" font-size="18" fill="#1A1A2E">Check isAlive(); does not stop it.</text><rect x="360" y="116" width="98" height="30" rx="15" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><text x="372" y="137" font-size="18" fill="#C44E00">join(0)=∞</text><rect x="480" y="38" width="446" height="124" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="494" y="64" font-size="18" font-family="monospace" fill="#1A1A2E">② public void interrupt();</text><text x="494" y="94" font-size="18" fill="#1A1A2E">Asks the target thread to stop.</text><text x="494" y="118" font-size="18" fill="#1A1A2E">Not forced stop; blocked sleep/join/wait</text><text x="494" y="142" font-size="18" fill="#1A1A2E">throws and clears the status.</text><rect x="14" y="174" width="454" height="104" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="28" y="200" font-size="18" font-family="monospace" fill="#1A1A2E">③ public final boolean isAlive();</text><text x="28" y="228" font-size="18" fill="#1A1A2E">true = started and not terminated.</text><text x="28" y="252" font-size="18" fill="#1A1A2E">false also before start. No waiting;</text><text x="28" y="272" font-size="18" fill="#1A1A2E">observation only.</text><rect x="480" y="174" width="446" height="104" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="494" y="200" font-size="18" font-family="monospace" fill="#1A1A2E">④ public boolean isInterrupted();</text><text x="494" y="228" font-size="18" fill="#1A1A2E">Reads status without clearing it.</text><text x="494" y="252" font-size="18" fill="#1A1A2E">Worker checks during finite work units.</text><text x="494" y="272" font-size="18" fill="#5B41DF">observation</text><rect x="14" y="290" width="912" height="60" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><text x="28" y="314" font-size="18" fill="#1A1A2E">1 interrupt() request → 2 timed join() → 3 isAlive()</text><text x="28" y="338" font-size="18" fill="#C44E00">The worker must cooperate; the request alone does not establish exit.</text></svg>