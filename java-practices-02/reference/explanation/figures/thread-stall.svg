<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Two panels compare a worker that never terminates, leaving the caller stuck in join, with a cooperative cancellation and interrupt pattern followed by a bounded join and an isAlive check." font-family="Inter,sans-serif" font-size="18" fill="#1A1A2E"><defs><marker id="thread-stall-arrow-o-pjava02" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#C44E00"/></marker><marker id="thread-stall-arrow-g-pjava02" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#008866"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><rect x="10" y="8" width="300" height="316" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="24" y="34" font-size="20" font-weight="700" fill="#C44E00">Failure: no exit</text><rect x="24" y="48" width="272" height="54" rx="10" fill="#FAFAFE" stroke="#FF6200"/><circle cx="46" cy="75" r="12" fill="#1A1A2E"/><text x="46" y="81" text-anchor="middle" fill="#FAFAFE" font-weight="700">1</text><text x="68" y="71">Worker: while(true)</text><text x="68" y="93">ignores interrupt</text><rect x="24" y="116" width="272" height="54" rx="10" fill="#FAFAFE" stroke="#FF6200"/><circle cx="46" cy="143" r="12" fill="#1A1A2E"/><text x="46" y="149" text-anchor="middle" fill="#FAFAFE" font-weight="700">2</text><text x="68" y="149">Caller calls join()</text><rect x="24" y="184" width="272" height="54" rx="10" fill="#FAFAFE" stroke="#FF6200"/><circle cx="46" cy="211" r="12" fill="#1A1A2E"/><text x="46" y="217" text-anchor="middle" fill="#FAFAFE" font-weight="700">3</text><text x="68" y="207">Caller waits forever:</text><text x="68" y="229">worker never ends</text><path d="M160 102V114" stroke="#C44E00" stroke-width="2.5" marker-end="url(#thread-stall-arrow-o-pjava02)"/><path d="M160 170V182" stroke="#C44E00" stroke-width="2.5" marker-end="url(#thread-stall-arrow-o-pjava02)"/><rect x="24" y="250" width="272" height="60" rx="10" fill="#FF6200"/><text x="160" y="276" text-anchor="middle" font-weight="700">Worker never ends;</text><text x="160" y="298" text-anchor="middle" font-weight="700">not circular deadlock</text><rect x="325" y="8" width="605" height="316" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="339" y="34" font-size="20" font-weight="700" fill="#008866">Mitigation: cooperative stop</text><g fill="#FAFAFE" stroke="#00C48C"><rect x="339" y="44" width="577" height="34" rx="9"/><rect x="339" y="84" width="577" height="34" rx="9"/><rect x="339" y="124" width="577" height="34" rx="9"/><rect x="339" y="164" width="577" height="34" rx="9"/></g><g fill="#1A1A2E"><circle cx="361" cy="61" r="12"/><circle cx="361" cy="101" r="12"/><circle cx="361" cy="141" r="12"/><circle cx="361" cy="181" r="12"/></g><g fill="#FAFAFE" font-weight="700" text-anchor="middle"><text x="361" y="67">1</text><text x="361" y="107">2</text><text x="361" y="147">3</text><text x="361" y="187">4</text></g><text x="383" y="67">Worker checks cancel flag / work budget</text><text x="383" y="107">Caller requests interrupt()</text><text x="383" y="147">Worker sees it and exits cooperatively</text><text x="383" y="187">Caller join(timeout), then isAlive()</text><rect x="339" y="206" width="577" height="82" rx="10" fill="#1A1A2E"/><g font-family="monospace" font-size="18" fill="#FAFAFE"><text x="355" y="230">while (hasWork() &amp;&amp;</text><text x="355" y="252">  !Thread.currentThread().isInterrupted()) {</text><text x="355" y="274">  doOneUnit(); }</text></g><text x="339" y="312" font-weight="700" fill="#008866">Timed join alone does not stop the worker.</text></svg>