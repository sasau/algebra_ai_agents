<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Six snapshots show a caller invoking three quote tasks on a two-worker pool, workers running them, all Futures completing, the caller summing results in list order to 5400, and the executor closing before return." font-family="Inter,sans-serif" font-size="18" fill="#1A1A2E"><defs><marker id="executor-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#7A7A8A" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="15" y="26" font-size="21" font-weight="700">Two-worker executor: invokeAll waits, then get() sums</text><path d="M305 105H323" fill="none" stroke="#7A7A8A" stroke-width="2.5" marker-end="url(#executor-ar-pjava02)" /><path d="M615 105H633" fill="none" stroke="#7A7A8A" stroke-width="2.5" marker-end="url(#executor-ar-pjava02)" /><path d="M770 170V177H160V183" fill="none" stroke="#7A7A8A" stroke-width="2.5" marker-end="url(#executor-ar-pjava02)" /><path d="M305 250H323" fill="none" stroke="#7A7A8A" stroke-width="2.5" marker-end="url(#executor-ar-pjava02)" /><path d="M615 250H633" fill="none" stroke="#7A7A8A" stroke-width="2.5" marker-end="url(#executor-ar-pjava02)" /><g transform="translate(15,40)"><rect width="290" height="130" rx="14" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="28" cy="24" r="14" fill="#1A1A2E" /><text x="28" y="31" text-anchor="middle" font-weight="700" fill="#FAFAFE">1</text><text x="52" y="31" font-weight="700">CALLER invokeAll</text><text x="14" y="56" fill="#0066BB">deadline set; waits</text><rect x="14" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#B8B8C8" stroke-dasharray="5 4" /><text x="53" y="87" text-anchor="middle">W1</text><text x="53" y="108" text-anchor="middle">idle</text><rect x="106" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#B8B8C8" stroke-dasharray="5 4" /><text x="145" y="87" text-anchor="middle">W2</text><text x="145" y="108" text-anchor="middle">idle</text><rect x="198" y="66" width="78" height="50" rx="8" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="237" y="87" text-anchor="middle">Tasks</text><text x="237" y="108" text-anchor="middle">A B C</text></g><g transform="translate(325,40)"><rect width="290" height="130" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><circle cx="28" cy="24" r="14" fill="#1A1A2E" /><text x="28" y="31" text-anchor="middle" font-weight="700" fill="#FAFAFE">2</text><text x="52" y="31" font-weight="700">POOL starts</text><text x="14" y="56" fill="#C44E00">C waits in queue</text><rect x="14" y="66" width="78" height="50" rx="8" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="53" y="87" text-anchor="middle">W1</text><text x="53" y="108" text-anchor="middle">run A</text><rect x="106" y="66" width="78" height="50" rx="8" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="145" y="87" text-anchor="middle">W2</text><text x="145" y="108" text-anchor="middle">run B</text><rect x="198" y="66" width="78" height="50" rx="8" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="237" y="87" text-anchor="middle">Queue</text><text x="237" y="108" text-anchor="middle">C</text></g><g transform="translate(635,40)"><rect width="290" height="130" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><circle cx="28" cy="24" r="14" fill="#1A1A2E" /><text x="28" y="31" text-anchor="middle" font-weight="700" fill="#FAFAFE">3</text><text x="52" y="31" font-weight="700">POOL: sample run</text><text x="14" y="56" fill="#C44E00">A=1200 done; order varies</text><rect x="14" y="66" width="78" height="50" rx="8" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="53" y="87" text-anchor="middle">W1</text><text x="53" y="108" text-anchor="middle">run C</text><rect x="106" y="66" width="78" height="50" rx="8" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="145" y="87" text-anchor="middle">W2</text><text x="145" y="108" text-anchor="middle">run B</text><rect x="198" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#B8B8C8" stroke-dasharray="5 4" /><text x="237" y="87" text-anchor="middle">Queue</text><text x="237" y="108" text-anchor="middle">empty</text></g><g transform="translate(15,185)"><rect width="290" height="130" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><circle cx="28" cy="24" r="14" fill="#1A1A2E" /><text x="28" y="31" text-anchor="middle" font-weight="700" fill="#FAFAFE">4</text><text x="52" y="31" font-weight="700">invokeAll returns</text><text x="14" y="56" fill="#008866">Futures: [A,B,C] order</text><rect x="14" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#00C48C" stroke-width="2" /><text x="53" y="87" text-anchor="middle">A ok</text><text x="53" y="108" text-anchor="middle">1200</text><rect x="106" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#00C48C" stroke-width="2" /><text x="145" y="87" text-anchor="middle">B ok</text><text x="145" y="108" text-anchor="middle">1800</text><rect x="198" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#00C48C" stroke-width="2" /><text x="237" y="87" text-anchor="middle">C ok</text><text x="237" y="108" text-anchor="middle">2400</text></g><g transform="translate(325,185)"><rect width="290" height="130" rx="14" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="28" cy="24" r="14" fill="#1A1A2E" /><text x="28" y="31" text-anchor="middle" font-weight="700" fill="#FAFAFE">5</text><text x="52" y="31" font-weight="700">CALLER get()</text><text x="14" y="56" fill="#0066BB">0 → 1200 → 3000 → 5400</text><rect x="14" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#0091FF" stroke-width="2" /><text x="53" y="87" text-anchor="middle">+1200</text><text x="53" y="108" text-anchor="middle">=1200</text><rect x="106" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#0091FF" stroke-width="2" /><text x="145" y="87" text-anchor="middle">+1800</text><text x="145" y="108" text-anchor="middle">=3000</text><rect x="198" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#0091FF" stroke-width="2" /><text x="237" y="87" text-anchor="middle">+2400</text><text x="237" y="108" text-anchor="middle">=5400</text></g><g transform="translate(635,185)"><rect width="290" height="130" rx="14" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="28" cy="24" r="14" fill="#1A1A2E" /><text x="28" y="31" text-anchor="middle" font-weight="700" fill="#FAFAFE">6</text><text x="52" y="31" font-weight="700">CALLER exits try</text><text x="14" y="56" fill="#5B41DF">cleanup, then return</text><rect x="14" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#B8B8C8" stroke-dasharray="5 4" /><text x="53" y="87" text-anchor="middle">W1</text><text x="53" y="108" text-anchor="middle">closed</text><rect x="106" y="66" width="78" height="50" rx="8" fill="#FAFAFE" stroke="#B8B8C8" stroke-dasharray="5 4" /><text x="145" y="87" text-anchor="middle">W2</text><text x="145" y="108" text-anchor="middle">closed</text><rect x="198" y="66" width="78" height="50" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="237" y="87" text-anchor="middle">return</text><text x="237" y="108" text-anchor="middle">5400</text></g></svg>