<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Two traces with tickets starting at one: separate get and decrementAndGet calls let two threads both pass the check and drive tickets to minus one, while compareAndSet lets only one thread claim the ticket and the other rereads zero and reports sold out." font-family="Inter,sans-serif"><defs><marker id="atomic-check-act-arrow-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><rect x="14" y="12" width="451" height="236" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><rect x="475" y="12" width="451" height="236" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="30" y="40" font-size="20" font-weight="700" fill="#C44E00">Check-then-act fails</text><text x="491" y="40" font-size="20" font-weight="700" fill="#008866">compareAndSet repairs</text><g font-size="18" fill="#1A1A2E"><text x="62" y="76">A get()==1</text><text x="62" y="112">B get()==1</text><text x="62" y="148">A decrementAndGet → 0</text><text x="62" y="184">B decrementAndGet → -1</text><text x="30" y="214" font-weight="700" fill="#C44E00">Rule tickets ≥ 0 breaks</text><text x="30" y="238" fill="#C44E00">Each call atomic; whole check is not</text><text x="523" y="76">Read expected 1</text><text x="523" y="112">A CAS(1,0) succeeds</text><text x="523" y="148">B CAS(1,0) fails, no change</text><text x="523" y="184">B rereads 0: sold out</text><text x="491" y="214" font-weight="700" fill="#008866">Final 0, exactly one claim</text><text x="491" y="238" fill="#008866">Retry must reread and recheck</text></g><g fill="#1A1A2E"><circle cx="38" cy="70" r="12"/><circle cx="38" cy="106" r="12"/><circle cx="38" cy="142" r="12"/><circle cx="38" cy="178" r="12"/><circle cx="499" cy="70" r="12"/><circle cx="499" cy="106" r="12"/><circle cx="499" cy="142" r="12"/><circle cx="499" cy="178" r="12"/></g><g font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle"><text x="38" y="76">1</text><text x="38" y="112">2</text><text x="38" y="148">3</text><text x="38" y="184">4</text><text x="499" y="76">1</text><text x="499" y="112">2</text><text x="499" y="148">3</text><text x="499" y="184">4</text></g><g stroke="#1A1A2E" stroke-width="2" marker-end="url(#atomic-check-act-arrow-pjava02)"><path d="M38 84V92"/><path d="M38 120V128"/><path d="M38 156V164"/><path d="M499 84V92"/><path d="M499 120V128"/><path d="M499 156V164"/></g><g font-size="18" font-weight="700" text-anchor="middle"><rect x="360" y="60" width="90" height="36" rx="8" fill="#E6F4FF" stroke="#0091FF"/><text x="405" y="84" fill="#0066BB">shared 1</text><rect x="360" y="132" width="90" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF"/><text x="405" y="156" fill="#5B41DF">shared 0</text><rect x="360" y="180" width="90" height="36" rx="8" fill="#FFF4ED" stroke="#FF6200"/><text x="405" y="204" fill="#C44E00">shared -1</text><rect x="820" y="60" width="90" height="36" rx="8" fill="#E6F4FF" stroke="#0091FF"/><text x="865" y="84" fill="#0066BB">shared 1</text><rect x="820" y="132" width="90" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF"/><text x="865" y="156" fill="#5B41DF">shared 0</text></g><rect x="14" y="258" width="912" height="62" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="30" y="285" font-size="18" font-weight="700" fill="#0066BB">Alternatives:</text><text x="30" y="308" font-size="18" fill="#1A1A2E">lock the whole check + decrement, or use Semaphore permits; retries do not guarantee every thread wins.</text></svg>