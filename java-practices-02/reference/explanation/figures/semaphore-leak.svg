<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Left: a task acquires the only permit, throws before a missing release, and later tasks stall forever. Right: acquire before try and release in finally restores the permit. Bottom: if acquire is interrupted, do not release." font-family="Inter,sans-serif"><defs><marker id="semaphore-leak-ar-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="20" y="26" font-size="21" font-weight="700" fill="#1A1A2E">Semaphore leak: stall, not circular deadlock</text><rect x="14" y="38" width="450" height="190" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><rect x="476" y="38" width="450" height="190" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="30" y="64" font-size="18" font-weight="700" fill="#C44E00">Bug: release missing</text><text x="492" y="64" font-size="18" font-weight="700" fill="#008866">Fix: release in finally</text><g fill="#1A1A2E" font-size="18"><circle cx="38" cy="94" r="12"/><circle cx="38" cy="132" r="12"/><circle cx="38" cy="170" r="12"/><circle cx="38" cy="208" r="12"/></g><g fill="#FAFAFE" font-size="18" font-weight="700" text-anchor="middle"><text x="38" y="100">1</text><text x="38" y="138">2</text><text x="38" y="176">3</text><text x="38" y="214">4</text></g><g fill="#1A1A2E" font-size="18"><text x="60" y="100">acquire: free 1→0</text><text x="60" y="138">use throws; no release</text><text x="60" y="176">task ends: free stays 0</text><text x="60" y="214">later tasks wait forever</text></g><path d="M330 112V122" stroke="#1A1A2E" stroke-width="2" marker-end="url(#semaphore-leak-ar-pjava02)"/><path d="M330 150V160" stroke="#1A1A2E" stroke-width="2" marker-end="url(#semaphore-leak-ar-pjava02)"/><path d="M330 188V198" stroke="#1A1A2E" stroke-width="2" marker-end="url(#semaphore-leak-ar-pjava02)"/><rect x="360" y="84" width="92" height="40" rx="8" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="406" y="111" font-size="18" text-anchor="middle" fill="#1A1A2E">free 0</text><rect x="500" y="80" width="400" height="34" rx="8" fill="#E6F4FF" stroke="#0091FF"/><text x="510" y="104" font-size="18" fill="#1A1A2E">acquire() succeeds: free 1→0</text><rect x="500" y="122" width="400" height="98" rx="8" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="510" y="146" font-size="18" fill="#1A1A2E">try { use() throws }</text><text x="510" y="170" font-size="18" fill="#1A1A2E">finally { release(); } free 0→1</text><text x="510" y="198" font-size="18" fill="#008866">Same acquired permit is paired</text><path d="M884 114V122" stroke="#1A1A2E" stroke-width="2" fill="none" marker-end="url(#semaphore-leak-ar-pjava02)"/><path d="M884 170H890V210" stroke="#1A1A2E" stroke-width="2" fill="none" marker-end="url(#semaphore-leak-ar-pjava02)"/><text x="892" y="196" font-size="18" fill="#008866" text-anchor="end"></text><rect x="14" y="240" width="912" height="76" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="30" y="268" font-size="18" font-weight="700" fill="#5B41DF">Caution: interrupted acquire</text><text x="30" y="296" font-size="18" fill="#1A1A2E">acquire throws before success → no permit → do not release; extra release can exceed the initial limit.</text><text x="500" y="268" font-size="18" fill="#1A1A2E">Acquire before try; release in finally.</text></svg>