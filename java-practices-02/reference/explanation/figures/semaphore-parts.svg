<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Diagram of Semaphore(2): the permit counter is now zero because tasks A and B hold the two admission slots, while tasks C and D wait outside until a release increments the counter." font-family="Inter,sans-serif"><defs><marker id="semaphore-parts-arr-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="20" y="28" font-size="22" font-weight="700" fill="#1A1A2E">Anatomy of Semaphore(2)</text><rect x="20" y="44" width="200" height="130" rx="14" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="120" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">PERMIT COUNTER</text><text x="120" y="118" text-anchor="middle" font-size="18" fill="#1A1A2E">start: 2</text><text x="120" y="156" text-anchor="middle" font-size="36" font-weight="700" fill="#5B41DF">now 0</text><circle cx="32" cy="56" r="12" fill="#1A1A2E"/><text x="32" y="62" text-anchor="middle" font-size="18" fill="#FAFAFE">1</text><rect x="330" y="44" width="300" height="130" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="480" y="70" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">resource region</text><rect x="350" y="92" width="120" height="66" rx="10" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><rect x="490" y="92" width="120" height="66" rx="10" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="410" y="132" text-anchor="middle" font-size="18" fill="#1A1A2E">task A</text><text x="550" y="132" text-anchor="middle" font-size="18" fill="#1A1A2E">task B</text><circle cx="342" cy="56" r="12" fill="#1A1A2E"/><text x="342" y="62" text-anchor="middle" font-size="18" fill="#FAFAFE">2</text><rect x="20" y="206" width="200" height="104" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="120" y="236" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">waiting outside</text><text x="120" y="276" text-anchor="middle" font-size="18" fill="#1A1A2E">task C   task D</text><text x="120" y="298" text-anchor="middle" font-size="18" fill="#C44E00">no order promise</text><circle cx="32" cy="218" r="12" fill="#1A1A2E"/><text x="32" y="224" text-anchor="middle" font-size="18" fill="#FAFAFE">3</text><path d="M220 240 H300 Q320 240 320 200 V150 H328" fill="none" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#semaphore-parts-arr-pjava02)"/><text x="242" y="190" font-size="18" fill="#1A1A2E">wait at 0</text><path d="M630 110 H700" fill="none" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#semaphore-parts-arr-pjava02)"/><text x="640" y="98" font-size="18" fill="#1A1A2E">release()</text><rect x="710" y="44" width="212" height="130" rx="14" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="816" y="72" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A2E">release()</text><text x="816" y="104" text-anchor="middle" font-size="18" fill="#1A1A2E">increment count</text><text x="816" y="130" text-anchor="middle" font-size="18" fill="#1A1A2E">may enable a</text><text x="816" y="154" text-anchor="middle" font-size="18" fill="#1A1A2E">waiting task</text><rect x="330" y="196" width="592" height="114" rx="14" fill="#FAFAFE" stroke="#7A7A8A" stroke-width="2"/><text x="346" y="224" font-size="18" font-family="monospace" fill="#1A1A2E">permits.acquire(); // before try</text><text x="346" y="250" font-size="18" font-family="monospace" fill="#1A1A2E">try { useResource(); }</text><text x="346" y="276" font-size="18" font-family="monospace" fill="#1A1A2E">finally { permits.release(); }</text><text x="346" y="302" font-size="18" fill="#5B41DF">No owner check; extra release can exceed 2.</text><path d="M324 138V162" stroke="#C44E00" stroke-width="4"/></svg>