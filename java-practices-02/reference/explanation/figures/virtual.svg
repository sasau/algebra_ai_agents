<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Four numbered snapshots show virtual thread V1 running on carrier C1, parking during blocking I/O, V2 using C1 while V1 waits, then V1 resuming on available carrier C2; a bottom strip contrasts this with a blocked platform thread." font-family="Inter,sans-serif"><defs><marker id="virtual-arrow-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="16" y="26" font-size="20" font-weight="700" fill="#1A1A2E">Virtual threads V1, V2 on carriers (C1, C2 illustrative)</text><g fill="#1A1A2E" font-size="18"><g><rect x="16" y="40" width="215" height="200" rx="12" fill="#FAFAFE" stroke="#B8B8C8"/><circle cx="40" cy="64" r="14" fill="#1A1A2E"/><text x="40" y="70" text-anchor="middle" fill="#FAFAFE" font-weight="700">1</text><text x="62" y="70" font-weight="700">C1 runs V1</text><rect x="28" y="86" width="191" height="36" rx="8" fill="#E6FAF3" stroke="#00C48C"/><text x="38" y="110">C1: V1 mounted</text><rect x="28" y="128" width="191" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF"/><text x="38" y="152">C2: available</text><text x="28" y="188">Parked: none</text><text x="28" y="218">V2 runnable, waits</text></g><g><rect x="247" y="40" width="215" height="200" rx="12" fill="#FAFAFE" stroke="#B8B8C8"/><circle cx="271" cy="64" r="14" fill="#1A1A2E"/><text x="271" y="70" text-anchor="middle" fill="#FAFAFE" font-weight="700">2</text><text x="293" y="70" font-weight="700">V1 parks</text><rect x="259" y="86" width="191" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF"/><text x="269" y="110">C1: released</text><rect x="259" y="128" width="191" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF"/><text x="269" y="152">C2: available</text><text x="259" y="188" fill="#C44E00" font-weight="700">V1 PARKED (I/O)</text><text x="259" y="218">V2 runnable</text></g><g><rect x="478" y="40" width="215" height="200" rx="12" fill="#FAFAFE" stroke="#B8B8C8"/><circle cx="502" cy="64" r="14" fill="#1A1A2E"/><text x="502" y="70" text-anchor="middle" fill="#FAFAFE" font-weight="700">3</text><text x="524" y="70" font-weight="700">C1 runs V2</text><rect x="490" y="86" width="191" height="36" rx="8" fill="#E6F4FF" stroke="#0091FF"/><text x="500" y="110">C1: V2 mounted</text><rect x="490" y="128" width="191" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF"/><text x="500" y="152">C2: available</text><text x="490" y="188" fill="#C44E00" font-weight="700">V1 still PARKED</text><text x="490" y="218">awaits I/O event</text></g><g><rect x="709" y="40" width="215" height="200" rx="12" fill="#FAFAFE" stroke="#B8B8C8"/><circle cx="733" cy="64" r="14" fill="#1A1A2E"/><text x="733" y="70" text-anchor="middle" fill="#FAFAFE" font-weight="700">4</text><text x="755" y="70" font-weight="700">V1 resumes</text><rect x="721" y="86" width="191" height="36" rx="8" fill="#E6F4FF" stroke="#0091FF"/><text x="731" y="110">C1: V2 mounted</text><rect x="721" y="128" width="191" height="36" rx="8" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="731" y="152">C2: V1 mounted</text><text x="721" y="188">V1 event completed</text><text x="721" y="218" fill="#C44E00" font-weight="700">New carrier: C2</text></g></g><g stroke="#1A1A2E" stroke-width="2" marker-end="url(#virtual-arrow-pjava02)"><path d="M232 140H245"/><path d="M463 140H476"/><path d="M694 140H707"/></g><rect x="16" y="250" width="454" height="72" rx="12" fill="#FFF4ED" stroke="#FF6200"/><text x="30" y="278" font-size="18" fill="#1A1A2E" font-weight="700">Platform per task: T1 blocked</text><text x="30" y="306" font-size="18" fill="#1A1A2E">still owns its own OS thread</text><rect x="480" y="250" width="444" height="72" rx="12" fill="#E6FAF3" stroke="#00C48C"/><text x="494" y="278" font-size="18" fill="#1A1A2E" font-weight="700">Virtual: supported waiting</text><text x="494" y="306" font-size="18" fill="#1A1A2E">frees carrier; adds no CPU cores</text></svg>