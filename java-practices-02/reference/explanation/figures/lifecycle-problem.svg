<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Timeline of one possible unsafe schedule: the caller starts the worker, then reads null from the shared result, and only later the worker task begins and stores lesson-worker, with no join to wait for completion." font-family="Inter,sans-serif"><defs><marker id="lifecycle-problem-ar-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1A1A2E" /></marker><marker id="lifecycle-problem-sp-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5B41DF" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="28" font-size="21" font-weight="700" fill="#1A1A2E">One possible schedule, not guaranteed: result starts null</text><rect x="14" y="44" width="912" height="92" rx="12" fill="#E6F4FF" stroke="#0091FF" /><rect x="14" y="146" width="912" height="92" rx="12" fill="#E6FAF3" stroke="#00C48C" /><text x="26" y="86" font-size="18" font-weight="700" fill="#0066BB">CALLER</text><text x="26" y="108" font-size="18" fill="#1A1A2E">thread</text><text x="26" y="188" font-size="18" font-weight="700" fill="#008866">WORKER</text><text x="26" y="210" font-size="18" fill="#1A1A2E">thread</text><g stroke-width="2"><rect x="150" y="50" width="176" height="80" rx="10" fill="#FAFAFE" stroke="#0091FF" /><rect x="342" y="50" width="176" height="80" rx="10" fill="#FFF4ED" stroke="#FF6200" /><rect x="534" y="152" width="176" height="80" rx="10" fill="#FAFAFE" stroke="#00C48C" /><rect x="726" y="152" width="176" height="80" rx="10" fill="#E6FAF3" stroke="#00C48C" /></g><g font-size="18" fill="#1A1A2E"><text x="164" y="74">worker.start()</text><text x="164" y="95">shared: null</text><text x="164" y="116">spawns thread</text><text x="356" y="74">result.get()</text><text x="356" y="95">returns null</text><text x="356" y="116">value stays null</text><text x="548" y="176">task begins on</text><text x="548" y="197">lesson-worker</text><text x="548" y="218">shared: null</text><text x="740" y="176">result.set(...)</text><text x="740" y="197">shared: null →</text><text x="740" y="218">lesson-worker</text></g><g font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle"><circle cx="150" cy="50" r="14" fill="#1A1A2E" /><text x="150" y="56" fill="#FAFAFE">1</text><circle cx="342" cy="50" r="14" fill="#1A1A2E" /><text x="342" y="56" fill="#FAFAFE">2</text><circle cx="534" cy="152" r="14" fill="#1A1A2E" /><text x="534" y="158" fill="#FAFAFE">3</text><circle cx="726" cy="152" r="14" fill="#1A1A2E" /><text x="726" y="158" fill="#FAFAFE">4</text></g><path d="M326 90H340" stroke="#1A1A2E" stroke-width="2" marker-end="url(#lifecycle-problem-ar-pjava02)" /><path d="M710 192H724" stroke="#1A1A2E" stroke-width="2" marker-end="url(#lifecycle-problem-ar-pjava02)" /><path d="M238 130V192H532" fill="none" stroke="#5B41DF" stroke-width="3" marker-end="url(#lifecycle-problem-sp-pjava02)" /><text x="256" y="184" font-size="18" font-weight="700" fill="#5B41DF">spawn</text><path d="M430 252H814" stroke="#C44E00" stroke-width="3" stroke-dasharray="7 5" /><circle cx="430" cy="252" r="5" fill="#C44E00" /><circle cx="814" cy="252" r="5" fill="#C44E00" /><rect x="494" y="241" width="256" height="22" rx="6" fill="#FAFAFE" /><text x="622" y="259" font-size="18" font-weight="700" fill="#C44E00" text-anchor="middle">missing completion gap</text><rect x="14" y="272" width="446" height="48" rx="10" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><text x="30" y="303" font-size="18" fill="#1A1A2E">Caller already observed: null</text><rect x="480" y="272" width="446" height="48" rx="10" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="496" y="303" font-size="18" fill="#1A1A2E">Worker later stored: lesson-worker</text></svg>