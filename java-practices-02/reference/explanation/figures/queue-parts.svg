<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Diagram of an ArrayBlockingQueue of capacity 2 holding items A and B: producer put C waits for space while the queue is full, consumer take removes A, then C joins the tail behind B; a separate empty strip shows take waiting for an item until put A arrives." font-family="Inter,sans-serif"><defs><marker id="queue-parts-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="20" y="30" font-size="22" font-weight="700" fill="#1A1A2E">ArrayBlockingQueue&lt;String&gt;(2): items move, not threads</text><rect x="20" y="48" width="130" height="90" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="85" y="86" text-anchor="middle" font-size="18" fill="#1A1A2E">Producer</text><text x="85" y="114" text-anchor="middle" font-size="18" fill="#1A1A2E">put(C)</text><circle cx="34" cy="62" r="12" fill="#1A1A2E"/><text x="34" y="68" text-anchor="middle" font-size="18" fill="#FAFAFE">1</text><rect x="45" y="150" width="80" height="40" rx="10" fill="#FFF4ED" stroke="#C44E00" stroke-width="2"/><text x="85" y="177" text-anchor="middle" font-size="18" fill="#1A1A2E">C</text><path d="M85 140V148" stroke="#1A1A2E" stroke-width="2"/><text x="135" y="176" font-size="18" fill="#1A1A2E">outside</text><path d="M150 93H235" stroke="#1A1A2E" stroke-width="3" marker-end="url(#queue-parts-ar-pjava02)"/><text x="160" y="82" font-size="18" fill="#C44E00">waits</text><rect x="240" y="48" width="330" height="140" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="405" y="74" text-anchor="middle" font-size="18" fill="#1A1A2E">buffer slots (FIFO)</text><circle cx="256" cy="64" r="12" fill="#1A1A2E"/><text x="256" y="70" text-anchor="middle" font-size="18" fill="#FAFAFE">2</text><rect x="260" y="90" width="130" height="50" rx="10" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="325" y="123" text-anchor="middle" font-size="18" fill="#1A1A2E">head A</text><rect x="420" y="90" width="130" height="50" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="485" y="123" text-anchor="middle" font-size="18" fill="#1A1A2E">tail B</text><text x="405" y="170" text-anchor="middle" font-size="18" fill="#1A1A2E">size 2 / capacity 2 = FULL</text><path d="M570 93H650" stroke="#1A1A2E" stroke-width="3" marker-end="url(#queue-parts-ar-pjava02)"/><rect x="655" y="48" width="130" height="90" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="720" y="86" text-anchor="middle" font-size="18" fill="#1A1A2E">Consumer</text><text x="720" y="114" text-anchor="middle" font-size="18" fill="#1A1A2E">take()</text><circle cx="669" cy="62" r="12" fill="#1A1A2E"/><text x="669" y="68" text-anchor="middle" font-size="18" fill="#FAFAFE">3</text><text x="600" y="82" font-size="18" fill="#008866">A out</text><rect x="800" y="48" width="125" height="140" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="862" y="82" text-anchor="middle" font-size="18" fill="#1A1A2E">After take:</text><text x="862" y="112" text-anchor="middle" font-size="18" fill="#1A1A2E">space opens</text><text x="862" y="142" text-anchor="middle" font-size="18" fill="#1A1A2E">B, then C</text><text x="862" y="172" text-anchor="middle" font-size="18" fill="#1A1A2E">C at tail</text><path d="M85 190V222H485V145" fill="none" stroke="#C44E00" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#queue-parts-ar-pjava02)"/><text x="180" y="216" font-size="18" fill="#1A1A2E">C enters behind B after space</text><rect x="20" y="240" width="905" height="78" rx="12" fill="#FFF4ED" stroke="#B8B8C8" stroke-width="2"/><text x="34" y="266" font-size="18" font-weight="700" fill="#1A1A2E">EMPTY: size 0</text><text x="34" y="296" font-size="18" fill="#1A1A2E">take() waits for ITEM; put(A) signals it</text><rect x="400" y="252" width="60" height="30" rx="8" fill="#FAFAFE" stroke="#7A7A8A" stroke-width="2"/><path d="M475 267H530" stroke="#1A1A2E" stroke-width="3" marker-end="url(#queue-parts-ar-pjava02)"/><text x="545" y="274" font-size="18" fill="#1A1A2E">A</text><text x="400" y="306" font-size="18" fill="#1A1A2E">Waiting releases the internal lock; no extra lock is needed</text></svg>