<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Six-event trace of workers A and B sharing one monitor M: A enters, reads 0, writes 1 and exits, then B acquires M, reads 1, writes 2 and exits, so count ends at 2." font-family="Inter,sans-serif"><defs><marker id="monitor-arrow-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B41DF" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="28" font-size="21" font-weight="700" fill="#1A1A2E">One monitor M: count 0 → 2</text><text x="14" y="124" font-size="20" font-weight="700" fill="#0066BB">A</text><text x="14" y="180" font-size="20" font-weight="700" fill="#008866">B</text><text x="14" y="252" font-size="18" font-weight="700" fill="#1A1A2E">State</text><rect x="100" y="84" width="546" height="50" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" stroke-dasharray="6 4" /><rect x="652" y="140" width="270" height="50" rx="10" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" stroke-dasharray="6 4" /><rect x="238" y="140" width="132" height="50" rx="10" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><g font-size="18" fill="#1A1A2E" text-anchor="middle"><g font-weight="700"><circle cx="166" cy="60" r="14" fill="#1A1A2E" /><circle cx="304" cy="60" r="14" fill="#1A1A2E" /><circle cx="442" cy="60" r="14" fill="#1A1A2E" /><circle cx="580" cy="60" r="14" fill="#1A1A2E" /><circle cx="718" cy="60" r="14" fill="#1A1A2E" /><circle cx="856" cy="60" r="14" fill="#1A1A2E" /></g><g fill="#FAFAFE" font-weight="700"><text x="166" y="66" fill="#FAFAFE">1</text><text x="304" y="66" fill="#FAFAFE">2</text><text x="442" y="66" fill="#FAFAFE">3</text><text x="580" y="66" fill="#FAFAFE">4</text><text x="718" y="66" fill="#FAFAFE">5</text><text x="856" y="66" fill="#FAFAFE">6</text></g><text x="166" y="106">A enters</text><text x="166" y="127">M free→A</text><text x="304" y="106">A reads 0</text><text x="304" y="127">computes 1</text><text x="442" y="106">A writes 1</text><text x="442" y="127">inside M</text><text x="580" y="106">A exits</text><text x="580" y="127">M released</text><text x="304" y="162">B WAITS</text><text x="304" y="183">outside M</text><text x="718" y="162">B enters M</text><text x="718" y="183">reads 1 → 2</text><text x="856" y="162">B writes 2</text><text x="856" y="183">B exits</text></g><g fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"><rect x="100" y="214" width="132" height="82" rx="10" /><rect x="238" y="214" width="132" height="82" rx="10" /><rect x="376" y="214" width="132" height="82" rx="10" /><rect x="514" y="214" width="132" height="82" rx="10" /><rect x="652" y="214" width="132" height="82" rx="10" /><rect x="790" y="214" width="132" height="82" rx="10" /></g><g font-size="18" fill="#1A1A2E" text-anchor="middle"><g font-weight="700"><text x="166" y="244">M = A</text><text x="304" y="244">M = A</text><text x="442" y="244">M = A</text><text x="580" y="244">M free</text><text x="718" y="244">M = B</text><text x="856" y="244">M free</text></g><text x="166" y="278">count 0</text><text x="304" y="278">count 0</text><text x="442" y="278">count 0→1</text><text x="580" y="278">count 1</text><text x="718" y="278">count 1</text><text x="856" y="278">count 1→2</text></g><path d="M186 60H284" stroke="#5B41DF" stroke-width="2" marker-end="url(#monitor-arrow-pjava02)" /><path d="M324 60H422" stroke="#5B41DF" stroke-width="2" marker-end="url(#monitor-arrow-pjava02)" /><path d="M462 60H560" stroke="#5B41DF" stroke-width="2" marker-end="url(#monitor-arrow-pjava02)" /><path d="M600 60H698" stroke="#5B41DF" stroke-width="2" marker-end="url(#monitor-arrow-pjava02)" /><path d="M738 60H836" stroke="#5B41DF" stroke-width="2" marker-end="url(#monitor-arrow-pjava02)" /><path d="M590 136C610 160 630 165 650 165" fill="none" stroke="#5B41DF" stroke-width="2.5" marker-end="url(#monitor-arrow-pjava02)" /><text x="14" y="321" font-size="18" fill="#1A1A2E">Dashed = synchronized(M). One possible order; B could enter first.</text></svg>