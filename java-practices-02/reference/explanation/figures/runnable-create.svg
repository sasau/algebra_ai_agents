<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Runnable declares one abstract method, void run(), and the lambda () -&gt; { System.out.println(&quot;work&quot;); } supplies that body; assignment only stores task, task.run() runs the body on the caller, and Thread.start() schedules it on a worker." font-family="Inter,sans-serif"><defs><marker id="runnable-create-arrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="20" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Runnable: contract and lambda</text><rect x="20" y="42" width="400" height="168" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="36" y="70" font-size="18" fill="#0066BB">Selected declaration</text><text x="36" y="100" font-size="18" font-family="monospace" fill="#1A1A2E">@FunctionalInterface</text><text x="36" y="126" font-size="18" font-family="monospace" fill="#1A1A2E">public interface Runnable {</text><text x="52" y="152" font-size="18" font-family="monospace" fill="#1A1A2E">void run();</text><text x="36" y="178" font-size="18" font-family="monospace" fill="#1A1A2E">}</text><text x="36" y="200" font-size="18" fill="#1A1A2E">one method to implement; no result</text><rect x="470" y="42" width="450" height="168" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><text x="486" y="70" font-size="18" fill="#C44E00">Task definition; not executed</text><text x="486" y="104" font-size="20" font-family="monospace" fill="#1A1A2E">Runnable task = () -&gt; {</text><text x="506" y="134" font-size="20" font-family="monospace" fill="#1A1A2E">System.out.println("work");</text><text x="486" y="164" font-size="20" font-family="monospace" fill="#1A1A2E">};</text><text x="486" y="196" font-size="18" fill="#1A1A2E">Runnable = type · task = variable</text><path d="M330 152H455V104" fill="none" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#runnable-create-arrow-pjava02)" /><rect x="20" y="226" width="900" height="90" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="36" y="258" font-size="18" fill="#1A1A2E">() = no inputs · -&gt; = body follows · { } = statements</text><rect x="36" y="272" width="420" height="34" rx="8" fill="#E6FAF3" stroke="#00C48C" /><text x="46" y="296" font-size="18" fill="#1A1A2E">task.run() → body on CALLER</text><rect x="476" y="272" width="430" height="34" rx="8" fill="#FFF4ED" stroke="#FF6200" /><text x="486" y="296" font-size="18" fill="#1A1A2E">worker.start() → body on WORKER</text></svg>