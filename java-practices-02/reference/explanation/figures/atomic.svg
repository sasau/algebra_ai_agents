<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Four-step trace of AtomicInteger incrementAndGet: callers A and B overlap, A's update takes the counter from 0 to 1, B's takes it from 1 to 2, and get returns 2 so both increments are preserved." font-family="Inter,sans-serif" id="atomic-svg-pjava02"><defs><marker id="atomic-arrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="20" y="28" font-size="21" font-weight="700" fill="#1A1A2E">AtomicInteger.incrementAndGet(): one indivisible increment per call</text><g font-size="18" fill="#1A1A2E"><rect x="20" y="46" width="205" height="150" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><rect x="245" y="46" width="205" height="150" rx="14" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><rect x="470" y="46" width="205" height="150" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><rect x="695" y="46" width="225" height="150" rx="14" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="46" cy="72" r="14" fill="#1A1A2E" /><circle cx="271" cy="72" r="14" fill="#1A1A2E" /><circle cx="496" cy="72" r="14" fill="#1A1A2E" /><circle cx="721" cy="72" r="14" fill="#1A1A2E" /><g font-weight="700" fill="#FAFAFE" text-anchor="middle"><text x="46" y="78" fill="#FAFAFE">1</text><text x="271" y="78" fill="#FAFAFE">2</text><text x="496" y="78" fill="#FAFAFE">3</text><text x="721" y="78" fill="#FAFAFE">4</text></g><text x="68" y="78" font-weight="700">A, B call</text><text x="293" y="78" font-weight="700">A takes effect</text><text x="518" y="78" font-weight="700">B takes effect</text><text x="743" y="78" font-weight="700">Wait both</text><text x="38" y="112">A, B overlap</text><text x="38" y="138">counter = 0</text><text x="38" y="170">no result yet</text><text x="263" y="112">shared 0 → 1</text><text x="263" y="138">A returns 1</text><text x="263" y="170">one step</text><text x="488" y="112">shared 1 → 2</text><text x="488" y="138">B returns 2</text><text x="488" y="170">one step</text><text x="713" y="112">get() = 2</text><text x="713" y="138">two increments</text><text x="713" y="170">preserved</text></g><g stroke="#1A1A2E" stroke-width="3" marker-end="url(#atomic-arrow-pjava02)"><path d="M225 121H243" /><path d="M450 121H468" /><path d="M675 121H693" /></g><rect x="20" y="212" width="420" height="52" rx="26" fill="#FAFAFE" stroke="#1A1A2E" stroke-width="2" /><text x="40" y="244" font-size="18" fill="#1A1A2E">shared: 0 ⟶ 1 ⟶ 2 (no half-states)</text><rect x="460" y="212" width="460" height="52" rx="14" fill="#F0EDFF" stroke="#5B41DF" stroke-width="2" /><text x="476" y="244" font-size="18" fill="#1A1A2E">One valid ordering; B could be first</text><text x="20" y="292" font-size="18" fill="#1A1A2E">Calls may return in a different order; no first-come guarantee.</text><text x="20" y="316" font-size="18" fill="#C44E00">Protects this counter; several fields need more coordination.</text></svg>