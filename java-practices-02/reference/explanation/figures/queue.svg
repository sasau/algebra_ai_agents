<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Six numbered snapshots of a capacity-two FIFO queue show A and B pre-filled, producer put C waiting, consumer taking A, C inserted behind B, the future completing, and drainTo outputting A, B, C." font-family="Inter,sans-serif" font-size="18" id="queue-figure-pjava02"><defs><marker id="queue-arrow-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="20" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Capacity-2 queue: one possible order of thread actions</text>
<g id="queue-card1-pjava02"><rect x="20" y="44" width="280" height="132" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="42" cy="68" r="14" fill="#1A1A2E" /><text x="42" y="75" text-anchor="middle" font-weight="700" fill="#FAFAFE">1</text><text x="64" y="75" font-weight="700" fill="#1A1A2E">Caller: pre-fill</text>
<rect x="40" y="90" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#0066BB" stroke-width="2" /><text x="65" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">A</text><rect x="94" y="90" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#0066BB" stroke-width="2" /><text x="119" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">B</text><text x="170" y="116" fill="#1A1A2E">front→back</text><text x="40" y="160" fill="#1A1A2E">queue [A,B]; free 0</text></g>
<g id="queue-card2-pjava02"><rect x="330" y="44" width="280" height="132" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><circle cx="352" cy="68" r="14" fill="#1A1A2E" /><text x="352" y="75" text-anchor="middle" font-weight="700" fill="#FAFAFE">2</text><text x="374" y="75" font-weight="700" fill="#1A1A2E">Producer: aboutToPut</text>
<rect x="350" y="90" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#C44E00" stroke-width="2" /><text x="375" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">A</text><rect x="404" y="90" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#C44E00" stroke-width="2" /><text x="429" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">B</text><rect x="548" y="90" width="42" height="40" rx="6" fill="#FFF4ED" stroke="#C44E00" stroke-width="2" stroke-dasharray="5 4" /><text x="569" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">C</text><text x="470" y="106" fill="#1A1A2E">put?</text><path d="M544 118L460 118" stroke="#1A1A2E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#queue-arrow-pjava02)" /><text x="350" y="160" fill="#1A1A2E">full [A,B]; may wait</text></g>
<g id="queue-card3-pjava02"><rect x="640" y="44" width="280" height="132" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="662" cy="68" r="14" fill="#1A1A2E" /><text x="662" y="75" text-anchor="middle" font-weight="700" fill="#FAFAFE">3</text><text x="684" y="75" font-weight="700" fill="#1A1A2E">Consumer: take()</text>
<rect x="660" y="90" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#5B41DF" stroke-width="2" /><text x="685" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">B</text><rect x="714" y="90" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#5B41DF" stroke-width="2" stroke-dasharray="5 4" /><rect x="860" y="90" width="50" height="40" rx="6" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="885" y="118" text-anchor="middle" font-weight="700" fill="#1A1A2E">A</text><text x="772" y="106" fill="#1A1A2E">take A</text><path d="M768 118L854 118" stroke="#1A1A2E" stroke-width="2" marker-end="url(#queue-arrow-pjava02)" /><text x="660" y="160" fill="#1A1A2E">out [A]; free 1</text></g>
<g id="queue-card4-pjava02"><rect x="20" y="190" width="280" height="132" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><circle cx="42" cy="214" r="14" fill="#1A1A2E" /><text x="42" y="221" text-anchor="middle" font-weight="700" fill="#FAFAFE">4</text><text x="64" y="221" font-weight="700" fill="#1A1A2E">Producer: put(C) done</text>
<rect x="40" y="236" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#C44E00" stroke-width="2" /><text x="65" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">B</text><rect x="94" y="236" width="50" height="40" rx="6" fill="#FFF4ED" stroke="#C44E00" stroke-width="4" /><text x="119" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">C</text><rect x="244" y="236" width="42" height="40" rx="6" fill="#FFF4ED" stroke="#C44E00" stroke-width="2" stroke-dasharray="5 4" /><text x="265" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">C</text><text x="160" y="250" fill="#1A1A2E">insert</text><path d="M240 264L152 264" stroke="#1A1A2E" stroke-width="2" marker-end="url(#queue-arrow-pjava02)" /><text x="40" y="306" fill="#1A1A2E">queue [B,C]; out [A]; free 0</text></g>
<g id="queue-card5-pjava02"><rect x="330" y="190" width="280" height="132" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="352" cy="214" r="14" fill="#1A1A2E" /><text x="352" y="221" text-anchor="middle" font-weight="700" fill="#FAFAFE">5</text><text x="374" y="221" font-weight="700" fill="#1A1A2E">Caller: future.get()</text>
<rect x="350" y="236" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#0066BB" stroke-width="2" /><text x="375" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">B</text><rect x="404" y="236" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#0066BB" stroke-width="2" /><text x="429" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">C</text><path d="M500 258L512 270L538 242" fill="none" stroke="#008866" stroke-width="5" /><text x="350" y="306" fill="#1A1A2E">insertion complete; [B,C]</text></g>
<g id="queue-card6-pjava02"><rect x="640" y="190" width="280" height="132" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><circle cx="662" cy="214" r="14" fill="#1A1A2E" /><text x="662" y="221" text-anchor="middle" font-weight="700" fill="#FAFAFE">6</text><text x="684" y="221" font-weight="700" fill="#1A1A2E">Caller: drainTo(out)</text>
<rect x="660" y="236" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#008866" stroke-width="2" stroke-dasharray="5 4" /><rect x="714" y="236" width="50" height="40" rx="6" fill="#FAFAFE" stroke="#008866" stroke-width="2" stroke-dasharray="5 4" /><path d="M768 256L790 256" stroke="#1A1A2E" stroke-width="2" marker-end="url(#queue-arrow-pjava02)" /><rect x="796" y="236" width="38" height="40" rx="6" fill="#FAFAFE" stroke="#008866" stroke-width="2" /><text x="815" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">A</text><rect x="838" y="236" width="38" height="40" rx="6" fill="#FAFAFE" stroke="#008866" stroke-width="2" /><text x="857" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">B</text><rect x="880" y="236" width="34" height="40" rx="6" fill="#FAFAFE" stroke="#008866" stroke-width="2" /><text x="897" y="264" text-anchor="middle" font-weight="700" fill="#1A1A2E">C</text><text x="660" y="306" fill="#1A1A2E">queue empty; out [A,B,C]</text></g></svg>