<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Left: thread A loops forever inside synchronized, holding the monitor while B and C stay blocked and an interrupt does not release it. Right: bounded work is computed outside the monitor, then a short synchronized update releases it so B may enter." font-family="Inter,sans-serif"><defs><marker id="monitor-stall-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker><marker id="monitor-stall-ao-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#C44E00"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="14" y="24" font-size="20" font-weight="700" fill="#1A1A2E">Stalled monitor</text><text x="494" y="24" font-size="20" font-weight="700" fill="#1A1A2E">Repaired layout</text><line x1="470" y1="38" x2="470" y2="268" stroke="#B8B8C8" stroke-width="2"/><rect x="14" y="40" width="440" height="228" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="28" y="68" font-size="18" fill="#1A1A2E">synchronized(lock) {</text><text x="46" y="90" font-size="18" fill="#1A1A2E">while(true){ work(); }</text><text x="28" y="112" font-size="18" fill="#1A1A2E">}</text><rect x="240" y="48" width="200" height="68" rx="10" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="252" y="76" font-size="18" fill="#1A1A2E">Owner A inside</text><text x="252" y="102" font-size="18" fill="#C44E00">lock never freed</text><text x="28" y="146" font-size="18" fill="#1A1A2E">Threads waiting:</text><rect x="28" y="158" width="110" height="40" rx="8" fill="#F0EDFF" stroke="#5B41DF" stroke-width="2"/><text x="40" y="184" font-size="18" fill="#1A1A2E">B BLOCKED</text><rect x="150" y="158" width="110" height="40" rx="8" fill="#F0EDFF" stroke="#5B41DF" stroke-width="2"/><text x="162" y="184" font-size="18" fill="#1A1A2E">C BLOCKED</text><path d="M205 158 V128 H320 V118" fill="none" stroke="#1A1A2E" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#monitor-stall-ar-pjava02)"/><text x="28" y="224" font-size="18" font-weight="700" fill="#C44E00">Held indefinitely; no circular</text><text x="28" y="246" font-size="18" font-weight="700" fill="#C44E00">wait needed (no deadlock cycle)</text><path d="M440 190 H330 V120" fill="none" stroke="#C44E00" stroke-width="2" marker-end="url(#monitor-stall-ao-pjava02)"/><text x="290" y="212" font-size="18" fill="#1A1A2E">interrupt: no unlock</text><rect x="484" y="40" width="442" height="228" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><rect x="496" y="50" width="418" height="94" rx="10" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="508" y="74" font-size="18" fill="#1A1A2E">OUTSIDE: while(hasWork &amp;&amp;</text><text x="508" y="98" font-size="18" fill="#1A1A2E">!interrupted) compute</text><circle cx="896" cy="70" r="12" fill="#1A1A2E"/><text x="896" y="76" font-size="18" text-anchor="middle" fill="#FAFAFE">1</text><circle cx="896" cy="112" r="12" fill="#1A1A2E"/><text x="896" y="118" font-size="18" text-anchor="middle" fill="#FAFAFE">2</text><text x="508" y="128" font-size="18" fill="#008866">budget checked, then compute</text><path d="M700 146 V162" stroke="#1A1A2E" stroke-width="2" marker-end="url(#monitor-stall-ar-pjava02)"/><rect x="496" y="164" width="300" height="52" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="508" y="186" font-size="18" fill="#1A1A2E">synchronized(lock){</text><text x="508" y="208" font-size="18" fill="#1A1A2E">apply(delta); }</text><circle cx="816" cy="190" r="12" fill="#1A1A2E"/><text x="816" y="196" font-size="18" text-anchor="middle" fill="#FAFAFE">3</text><path d="M796 190 H850" stroke="#1A1A2E" stroke-width="2" marker-end="url(#monitor-stall-ar-pjava02)"/><circle cx="880" cy="190" r="12" fill="#1A1A2E"/><text x="880" y="196" font-size="18" text-anchor="middle" fill="#FAFAFE">4</text><text x="496" y="240" font-size="18" fill="#1A1A2E">release M</text><rect x="620" y="222" width="150" height="38" rx="8" fill="#F0EDFF" stroke="#5B41DF" stroke-width="2"/><text x="632" y="247" font-size="18" fill="#1A1A2E">B may enter</text><text x="14" y="302" font-size="18" fill="#1A1A2E">Cancellation must cooperate; never force-unlock another owner.</text></svg>