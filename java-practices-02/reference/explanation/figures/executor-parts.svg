<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Anatomy of an ExecutorService from newFixedThreadPool(2): the caller submits tasks into an unbounded task queue holding C and D, two platform worker threads W1 and W2 take tasks and run A and B, and each result completes a Future that the caller waits on with get." font-family="Inter,sans-serif" font-size="18" fill="#1A1A2E"><defs><marker id="executor-parts-arrow-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="14" y="24" font-size="20" font-weight="700">ExecutorService parts: submit, queue, workers, Future</text><rect x="14" y="44" width="150" height="190" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="89" y="72" text-anchor="middle" font-weight="700">CALLER</text><text x="89" y="96" text-anchor="middle">holds ex, f</text><rect x="24" y="140" width="130" height="68" rx="10" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="89" y="164" text-anchor="middle">caller wait</text><text x="89" y="190" text-anchor="middle">get() blocks</text><rect x="284" y="44" width="362" height="190" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="465" y="66" text-anchor="middle" font-weight="700">ExecutorService</text><text x="465" y="86" text-anchor="middle" fill="#0066BB" font-weight="700">newFixedThreadPool(2)</text><text x="465" y="106" text-anchor="middle">2 workers; queue can grow</text><rect x="298" y="116" width="122" height="76" rx="10" fill="#FAFAFE" stroke="#0066BB" stroke-width="2"/><text x="359" y="146" text-anchor="middle" font-weight="700">TASK QUEUE</text><rect x="310" y="154" width="46" height="30" rx="6" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="333" y="176" text-anchor="middle">C</text><rect x="362" y="154" width="46" height="30" rx="6" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="385" y="176" text-anchor="middle">D</text><rect x="486" y="120" width="148" height="30" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="560" y="142" text-anchor="middle">W1 runs A</text><rect x="486" y="156" width="148" height="30" rx="8" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="560" y="178" text-anchor="middle">W2 runs B</text><rect x="298" y="198" width="336" height="30" rx="8" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="466" y="220" text-anchor="middle">Idle worker waits if queue empty</text><rect x="766" y="44" width="160" height="190" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="846" y="72" text-anchor="middle" font-weight="700">Future result</text><rect x="782" y="84" width="128" height="26" rx="8" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="846" y="104" text-anchor="middle">pending</text><path d="M782 97H772V205" stroke="#1A1A2E" fill="none" stroke-width="2"/><path d="M772 141H780" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><path d="M772 173H780" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><path d="M772 205H780" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><rect x="782" y="128" width="128" height="26" rx="8" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="846" y="148" text-anchor="middle">value</text><rect x="782" y="160" width="128" height="26" rx="8" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="846" y="180" text-anchor="middle">failure</text><rect x="782" y="192" width="128" height="26" rx="8" fill="#FAFAFE" stroke="#7A7A8A" stroke-width="2"/><text x="846" y="212" text-anchor="middle">cancelled</text><path d="M164 154H282" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><text x="224" y="146" text-anchor="middle">submit</text><text x="224" y="180" text-anchor="middle" font-size="18" fill="#5B41DF">submit(c)</text><path d="M420 135H484" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><path d="M420 171H484" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><text x="452" y="126" text-anchor="middle">take</text><path d="M634 135H764" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><path d="M634 171H764" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><text x="706" y="126" text-anchor="middle">complete</text><path d="M89 234V262H846V236" fill="none" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><text x="465" y="254" text-anchor="middle">get: f.get() waits</text><rect x="14" y="274" width="190" height="44" rx="10" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="109" y="302" text-anchor="middle">accept + run</text><rect x="254" y="274" width="190" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="349" y="302" text-anchor="middle">shutdown()</text><rect x="495" y="274" width="190" height="44" rx="10" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="590" y="302" text-anchor="middle">finish tasks</text><rect x="735" y="274" width="190" height="44" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="830" y="302" text-anchor="middle">termination</text><path d="M204 296H252" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><path d="M444 296H493" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><path d="M685 296H733" stroke="#1A1A2E" stroke-width="2" marker-end="url(#executor-parts-arrow-pjava02)"/><g fill="#1A1A2E"><circle cx="24" cy="44" r="13"/><circle cx="297" cy="44" r="13"/><circle cx="308" cy="116" r="13"/><circle cx="634" cy="116" r="13"/><circle cx="778" cy="44" r="13"/><circle cx="14" cy="274" r="13"/></g><g fill="#FAFAFE" font-weight="700" text-anchor="middle"><text x="24" y="50">1</text><text x="297" y="50">2</text><text x="308" y="122">3</text><text x="634" y="122">4</text><text x="778" y="50">5</text><text x="14" y="280">6</text></g><path d="M282 84H166" stroke="#5B41DF" stroke-width="2" fill="none" marker-end="url(#executor-parts-arrow-pjava02)"/><text x="224" y="76" text-anchor="middle" fill="#5B41DF">Future f</text></svg>