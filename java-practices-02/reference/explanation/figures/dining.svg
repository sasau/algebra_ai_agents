<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Five numbered events show philosopher P0 taking lower fork F0 then higher fork F1, eating while P1 and P4 wait, then releasing F1 and F0; the ordering removes circular wait but does not prove starvation freedom." font-family="Inter,sans-serif"><defs><marker id="dining-arrow-pjava02" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8Z" fill="#7A7A8A" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="26" font-size="20" font-weight="700" fill="#1A1A2E">Global order: lower fork → higher fork</text><g font-size="18" fill="#1A1A2E"><rect x="14" y="40" width="540" height="48" rx="10" fill="#F0EDFF" stroke="#7B61FF" /><circle cx="38" cy="64" r="16" fill="#1A1A2E" /><text x="38" y="70" text-anchor="middle" font-weight="700" fill="#FAFAFE">1</text><text x="64" y="60" font-weight="700">P0 hungry</text><text x="64" y="80">F0 free, F1 free</text>
<rect x="14" y="94" width="540" height="48" rx="10" fill="#E6F4FF" stroke="#0091FF" /><circle cx="38" cy="118" r="16" fill="#1A1A2E" /><text x="38" y="124" text-anchor="middle" font-weight="700" fill="#FAFAFE">2</text><text x="64" y="114" font-weight="700">P0 acquires lower F0</text><text x="64" y="134">state: owns F0</text>
<rect x="14" y="148" width="540" height="48" rx="10" fill="#E6F4FF" stroke="#0091FF" /><circle cx="38" cy="172" r="16" fill="#1A1A2E" /><text x="38" y="178" text-anchor="middle" font-weight="700" fill="#FAFAFE">3</text><text x="64" y="168" font-weight="700">P0 acquires higher F1</text><text x="64" y="188">state: owns F0+F1</text>
<rect x="14" y="202" width="540" height="48" rx="10" fill="#FFF4ED" stroke="#FF6200" /><circle cx="38" cy="226" r="16" fill="#1A1A2E" /><text x="38" y="232" text-anchor="middle" font-weight="700" fill="#FAFAFE">4</text><text x="64" y="222" font-weight="700">P0 EATS with both forks</text><text x="64" y="242">P1 waits F1; P4 waits F0; P2/P3 think</text>
<rect x="14" y="256" width="540" height="48" rx="10" fill="#E6FAF3" stroke="#00C48C" /><circle cx="38" cy="280" r="16" fill="#1A1A2E" /><text x="38" y="286" text-anchor="middle" font-weight="700" fill="#FAFAFE">5</text><text x="64" y="276" font-weight="700">Later: finally releases F1, then F0</text><text x="64" y="296">state: F0 free, F1 free</text></g><g stroke="#7A7A8A" stroke-width="2" marker-end="url(#dining-arrow-pjava02)"><path d="M38 80V92" fill="none" /><path d="M38 134V146" /><path d="M38 188V200" /><path d="M38 242V254" /></g><text x="14" y="324" font-size="18" fill="#1A1A2E">Order prevents deadlock; some workers may still miss turns.</text>
<text x="740" y="26" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A2E">Snapshot at step 4</text><circle cx="740" cy="185" r="70" fill="#FFF4ED" stroke="#B8B8C8" stroke-width="2" /><circle cx="740" cy="140" r="16" fill="#FAFAFE" stroke="#7A7A8A" stroke-width="2" />
<g stroke-width="3" fill="none"><path d="M731 83L698 107" stroke="#FF6200" /><path d="M749 83L782 107" stroke="#FF6200" /></g><g stroke-width="2.5" fill="none" stroke-dasharray="6 5"><path d="M834 143L804 130" stroke="#0091FF" /><path d="M646 143L676 130" stroke="#7B61FF" /></g>
<g font-size="18" text-anchor="middle" fill="#1A1A2E"><circle cx="740" cy="65" r="22" fill="#FF6200" /><text x="740" y="71" font-weight="700">P0</text><circle cx="854" cy="148" r="22" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><text x="854" y="154">P1</text><circle cx="626" cy="148" r="22" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="626" y="154">P4</text><circle cx="811" cy="282" r="22" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="811" y="288">P2</text><circle cx="669" cy="282" r="22" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="669" y="288">P3</text>
<rect x="676" y="108" width="34" height="24" rx="6" fill="#FF6200" /><text x="693" y="126" fill="#1A1A2E" font-weight="700">F0</text><rect x="770" y="108" width="34" height="24" rx="6" fill="#FF6200" /><text x="787" y="126" font-weight="700">F1</text><rect x="799" y="198" width="34" height="24" rx="6" fill="#E6FAF3" stroke="#00C48C" /><text x="816" y="216">F2</text><rect x="723" y="253" width="34" height="24" rx="6" fill="#E6FAF3" stroke="#00C48C" /><text x="740" y="271">F3</text><rect x="647" y="198" width="34" height="24" rx="6" fill="#E6FAF3" stroke="#00C48C" /><text x="664" y="216">F4</text>
<text x="740" y="190">owns</text><text x="740" y="212">F0+F1</text><text x="740" y="235">eating</text><text x="885" y="120" fill="#0066BB">wait</text><text x="595" y="120" fill="#5B41DF">wait</text><text x="878" y="288">thinks</text><text x="602" y="288">thinks</text><text x="790" y="58" text-anchor="start" fill="#C44E00" font-weight="700">eats</text></g>
<g transform="translate(0 0)"><animateTransform attributeName="transform" type="translate" values="0 0;0 -34;0 0" dur="3s" repeatCount="indefinite" /><path d="M740 146V134" stroke="#C44E00" stroke-width="4" stroke-linecap="round" /><ellipse cx="740" cy="130" rx="6" ry="8" fill="#FF6200" /></g><text x="576" y="324" font-size="18" fill="#1A1A2E">P4 takes F0 before F4.</text></svg>