<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="future-parts-title-pjava02" aria-label="A Future is an outcome receipt: submit returns it immediately while the task runs separately, and it moves from PENDING to SUCCESS with 1200, FAILURE with IOException, or CANCELLED, with get, cancel, isDone and timeout behavior explained." font-family="Inter,sans-serif"><title id="future-parts-title-pjava02">Future as an outcome receipt</title><defs><marker id="future-parts-arrow-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><text x="14" y="26" font-size="21" font-weight="700" fill="#1A1A2E">Future holds a task result or failure; it is not a worker thread</text><rect x="14" y="40" width="220" height="222" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="24" y="66" font-size="18" fill="#1A1A2E">Future&lt;Integer&gt; f =</text><text x="24" y="90" font-size="18" fill="#1A1A2E">executor.submit(task);</text><path d="M124 98V120" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#future-parts-arrow-pjava02)"/><rect x="28" y="124" width="192" height="52" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="124" y="146" font-size="18" font-weight="700" text-anchor="middle" fill="#0066BB">Future returned</text><text x="124" y="168" font-size="18" text-anchor="middle" fill="#1A1A2E">immediately</text><rect x="28" y="202" width="192" height="52" rx="10" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="124" y="224" font-size="18" font-weight="700" text-anchor="middle" fill="#C44E00">task queued,</text><text x="124" y="246" font-size="18" text-anchor="middle" fill="#1A1A2E">then worker runs it</text><path d="M124 200V180" stroke="#7A7A8A" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#future-parts-arrow-pjava02)"/><rect x="246" y="40" width="294" height="222" rx="12" fill="#FAFAFE" stroke="#B8B8C8" stroke-width="2"/><text x="393" y="64" font-size="18" font-weight="700" text-anchor="middle" fill="#1A1A2E">Future states</text><rect x="258" y="136" width="116" height="48" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="316" y="166" font-size="18" font-weight="700" text-anchor="middle" fill="#5B41DF">PENDING</text><rect x="404" y="76" width="124" height="50" rx="10" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="466" y="97" font-size="18" font-weight="700" text-anchor="middle" fill="#008866">SUCCESS</text><text x="466" y="118" font-size="18" text-anchor="middle" fill="#1A1A2E">value 1200</text><rect x="404" y="138" width="124" height="50" rx="10" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="466" y="159" font-size="18" font-weight="700" text-anchor="middle" fill="#C44E00">FAILURE</text><text x="466" y="180" font-size="18" text-anchor="middle" fill="#1A1A2E">IOException</text><rect x="404" y="204" width="124" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="466" y="233" font-size="18" font-weight="700" text-anchor="middle" fill="#0066BB">CANCELLED</text><path d="M374 150L402 105" fill="none" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#future-parts-arrow-pjava02)"/><path d="M374 160H402" fill="none" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#future-parts-arrow-pjava02)"/><path d="M374 172L402 222" fill="none" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#future-parts-arrow-pjava02)"/><rect x="552" y="40" width="374" height="222" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><g font-size="18" fill="#1A1A2E"><text x="566" y="64"><tspan font-weight="700">get():</tspan> waits, then value</text><text x="566" y="85">or ExecutionException</text><text x="566" y="110"><tspan font-weight="700">cancel(true):</tspan> requests interrupt</text><text x="566" y="131">when applicable</text><text x="566" y="156"><tspan font-weight="700">isDone():</tspan> any of the 3 end states</text><text x="566" y="177" fill="#C44E00" font-weight="700">isDone() does not prove success</text><text x="566" y="204"><tspan font-weight="700">cancelled get():</tspan> CancellationException</text><text x="566" y="225">aggregator sees isCancelled(),</text><text x="566" y="246">then own TimeoutException</text></g><rect x="14" y="272" width="912" height="52" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="28" y="294" font-size="18" fill="#1A1A2E"><tspan font-weight="700">get(timeout)</tspan>: timeout does not cancel the task; caller decides separately.</text><text x="28" y="316" font-size="18" fill="#1A1A2E"><tspan font-weight="700">Timed invokeAll</tspan> cancels tasks that are still unfinished.</text></svg>