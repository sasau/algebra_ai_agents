<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Left: a fixed pool of two threads with an unbounded queue keeps growing while two workers stay busy. Right: a pool with two workers and a full queue of capacity two rejects task T5 with an exception, and the caller handles overload." font-family="Inter,sans-serif"><defs><marker id="executor-overload-arrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><rect x="14" y="14" width="442" height="302" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><rect x="484" y="14" width="442" height="302" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="32" y="46" font-size="21" font-weight="700" fill="#1A1A2E">newFixedThreadPool(2)</text><text x="502" y="46" font-size="21" font-weight="700" fill="#1A1A2E">Bounded ThreadPoolExecutor</text><rect x="32" y="64" width="190" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="46" y="93" font-size="18" fill="#1A1A2E">W1: slow task</text><rect x="240" y="64" width="190" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="254" y="93" font-size="18" fill="#1A1A2E">W2: slow task</text><rect x="32" y="136" width="398" height="52" rx="10" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="46" y="169" font-size="18" fill="#1A1A2E">queue: T3 T4 T5 T6 ...</text><path d="M390 150v26M410 150v26" stroke="#C44E00" stroke-width="3"/><text x="32" y="222" font-size="18" fill="#1A1A2E">Submissions continue; backlog grows</text><text x="32" y="250" font-size="18" fill="#1A1A2E">Delays and memory use grow</text><text x="32" y="290" font-size="18" font-weight="700" fill="#C44E00">Two workers ≠ limited queue</text><rect x="502" y="64" width="190" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="516" y="93" font-size="18" fill="#1A1A2E">W1: T1</text><rect x="710" y="64" width="190" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="724" y="93" font-size="18" fill="#1A1A2E">W2: T2</text><rect x="502" y="136" width="250" height="52" rx="10" fill="#FAFAFE" stroke="#008866" stroke-width="2"/><text x="516" y="169" font-size="18" fill="#1A1A2E">queue: [T3, T4] FULL</text><rect x="784" y="136" width="116" height="52" rx="10" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="798" y="169" font-size="18" fill="#1A1A2E">T5</text><path d="M784 162H756" stroke="#1A1A2E" stroke-width="2.5" marker-end="url(#executor-overload-arrow-pjava02)"/><text x="502" y="216" font-size="18" fill="#1A1A2E">AbortPolicy: core=max=2, capacity 2</text><text x="502" y="244" font-size="18" font-weight="700" fill="#C44E00">RejectedExecutionException</text><text x="502" y="276" font-size="18" fill="#1A1A2E">Caller: busy response or retry by deadline</text><text x="502" y="302" font-size="18" fill="#1A1A2E">No silent drops</text><g fill="#1A1A2E"><circle cx="486" cy="86" r="11"/><circle cx="766" cy="148" r="1" /><circle cx="486" cy="162" r="11"/><circle cx="772" cy="124" r="11"/><circle cx="486" cy="276" r="11"/></g><g fill="#FAFAFE" font-size="18" font-weight="700" text-anchor="middle"><text x="486" y="91">1</text><text x="486" y="167">2</text><text x="772" y="129">3</text><text x="486" y="281">4</text></g><path d="M754 150L768 164M768 150L754 164" stroke="#C44E00" stroke-width="3"/></svg>