<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" font-family="Inter,sans-serif" aria-label="Five numbered events show the caller recording five held first forks, interrupting all workers before joining, workers freeing only acquired forks, bounded joins with isAlive checks, and a stopped snapshot only if none are alive."><defs><marker id="recovery-arrow-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="30" font-size="21" font-weight="700" fill="#1A1A2E">Controlled deadlock recovery: five events</text><g font-size="18" fill="#1A1A2E"><rect x="14" y="48" width="171" height="180" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="36" cy="72" r="14" fill="#1A1A2E" /><text x="36" y="78" text-anchor="middle" font-weight="700" fill="#FAFAFE">1</text><text x="58" y="78" font-weight="700" fill="#0066BB">CALLER</text><text x="26" y="118">heldFirstForks</text><text x="26" y="140">= 5 snapshot</text><text x="26" y="162">all 5 held</text><g fill="#FF6200"><circle cx="31" cy="195" r="9" /><circle cx="61" cy="195" r="9" /><circle cx="91" cy="195" r="9" /><circle cx="121" cy="195" r="9" /><circle cx="151" cy="195" r="9" /></g>
<rect x="197" y="48" width="171" height="180" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="219" cy="72" r="14" fill="#1A1A2E" /><text x="219" y="78" text-anchor="middle" font-weight="700" fill="#FAFAFE">2</text><text x="241" y="78" font-weight="700" fill="#0066BB">CALLER</text><text x="209" y="118">interrupt()</text><text x="209" y="140">all 5 workers</text><text x="209" y="162">before any join</text><g fill="#FF6200"><circle cx="214" cy="195" r="9" /><circle cx="244" cy="195" r="9" /><circle cx="274" cy="195" r="9" /><circle cx="304" cy="195" r="9" /><circle cx="334" cy="195" r="9" /></g>
<rect x="380" y="48" width="171" height="180" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><circle cx="402" cy="72" r="14" fill="#1A1A2E" /><text x="402" y="78" text-anchor="middle" font-weight="700" fill="#FAFAFE">3</text><text x="424" y="78" font-weight="700" fill="#5B41DF">WORKERS</text><text x="392" y="118">wait sees</text><text x="392" y="140">interrupt;</text><text x="392" y="162">finally frees</text><text x="392" y="184">acquired only</text><g fill="#00C48C"><circle cx="397" cy="212" r="8" /><circle cx="427" cy="212" r="8" /><circle cx="457" cy="212" r="8" /><circle cx="487" cy="212" r="8" /><circle cx="517" cy="212" r="8" /></g>
<rect x="563" y="48" width="171" height="180" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><circle cx="585" cy="72" r="14" fill="#1A1A2E" /><text x="585" y="78" text-anchor="middle" font-weight="700" fill="#FAFAFE">4</text><text x="607" y="78" font-weight="700" fill="#0066BB">CALLER</text><text x="575" y="118">join(timeout)</text><text x="575" y="140">each worker,</text><text x="575" y="162">then isAlive()</text><text x="575" y="184">on all five</text><g fill="#00C48C"><circle cx="580" cy="212" r="8" /><circle cx="610" cy="212" r="8" /><circle cx="640" cy="212" r="8" /><circle cx="670" cy="212" r="8" /><circle cx="700" cy="212" r="8" /></g>
<rect x="746" y="48" width="171" height="180" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><circle cx="768" cy="72" r="14" fill="#1A1A2E" /><text x="768" y="78" text-anchor="middle" font-weight="700" fill="#FAFAFE">5</text><text x="790" y="78" font-weight="700" fill="#008866">CALLER</text><text x="758" y="118">workersStopped</text><text x="758" y="140">= true only if</text><text x="758" y="162">none alive</text><g fill="#00C48C"><circle cx="763" cy="195" r="9" /><circle cx="793" cy="195" r="9" /><circle cx="823" cy="195" r="9" /><circle cx="853" cy="195" r="9" /><circle cx="883" cy="195" r="9" /></g></g><g stroke="#1A1A2E" stroke-width="2" marker-end="url(#recovery-arrow-pjava02)"><path d="M186 72H196" /><path d="M369 72H379" /><path d="M552 72H562" /><path d="M735 72H745" /></g><rect x="14" y="238" width="912" height="84" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><g font-size="18" fill="#1A1A2E"><text x="28" y="262"><tspan font-weight="700" fill="#C44E00">Observation at 5:</tspan> interrupt is a cooperative request, not a force-kill.</text><text x="28" y="285">A worker may take and release a 2nd fork after neighbours free theirs.</text><text x="28" y="308">Outcome: no thread left waiting; held forks released.</text></g></svg>