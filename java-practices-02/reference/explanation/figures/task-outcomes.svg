<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Three alternative collectQuotes traces: success returns 1200 to the caller, failure surfaces ExecutionException caused by IOException, and a deadline cancels a task and throws TimeoutException; a cleanup strip warns that a cancelled Future does not prove the worker stopped." font-family="Inter,sans-serif" font-size="18" fill="#1A1A2E"><defs><marker id="task-outcomes-arrow-pjava02" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#1A1A2E" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="10" y="22" font-size="20" font-weight="700">collectQuotes: three alternative outcomes</text><g font-weight="700"><text x="10" y="70" fill="#008866">SUCCESS</text><text x="10" y="142" fill="#C44E00">FAILURE</text><text x="10" y="214" fill="#5B41DF">DEADLINE</text></g><g stroke="#1A1A2E" stroke-width="2" fill="none"><path d="M296 65H312" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M504 65H520" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M712 65H728" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M296 137H312" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M504 137H520" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M712 137H728" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M296 209H312" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M504 209H520" marker-end="url(#task-outcomes-arrow-pjava02)" /><path d="M712 209H728" marker-end="url(#task-outcomes-arrow-pjava02)" /></g><g fill="#E6FAF3" stroke="#00C48C" stroke-width="2"><rect x="106" y="32" width="190" height="66" rx="10" /><rect x="314" y="32" width="190" height="66" rx="10" /><rect x="522" y="32" width="190" height="66" rx="10" /><rect x="730" y="32" width="190" height="66" rx="10" /></g><g fill="#FFF4ED" stroke="#FF6200" stroke-width="2"><rect x="106" y="104" width="190" height="66" rx="10" /><rect x="314" y="104" width="190" height="66" rx="10" /><rect x="522" y="104" width="190" height="66" rx="10" /><rect x="730" y="104" width="190" height="66" rx="10" /></g><g fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"><rect x="106" y="176" width="190" height="66" rx="10" /><rect x="314" y="176" width="190" height="66" rx="10" /><rect x="522" y="176" width="190" height="66" rx="10" /><rect x="730" y="176" width="190" height="66" rx="10" /></g><g fill="#00C48C"><circle cx="124" cy="49" r="12" fill="#1A1A2E" /><circle cx="332" cy="49" r="12" fill="#1A1A2E" /><circle cx="540" cy="49" r="12" fill="#1A1A2E" /><circle cx="748" cy="49" r="12" fill="#1A1A2E" /></g><g fill="#FF6200"><circle cx="124" cy="121" r="12" fill="#1A1A2E" /><circle cx="332" cy="121" r="12" fill="#1A1A2E" /><circle cx="540" cy="121" r="12" fill="#1A1A2E" /><circle cx="748" cy="121" r="12" fill="#1A1A2E" /></g><g fill="#7B61FF"><circle cx="124" cy="193" r="12" fill="#1A1A2E" /><circle cx="332" cy="193" r="12" fill="#1A1A2E" /><circle cx="540" cy="193" r="12" fill="#1A1A2E" /><circle cx="748" cy="193" r="12" fill="#1A1A2E" /></g><g font-weight="700" text-anchor="middle" fill="#1A1A2E"><text x="124" y="55" fill="#FAFAFE">1</text><text x="332" y="55" fill="#FAFAFE">2</text><text x="540" y="55" fill="#FAFAFE">3</text><text x="748" y="55" fill="#FAFAFE">4</text><text x="124" y="127" fill="#FAFAFE">1</text><text x="332" y="127" fill="#FAFAFE">2</text><text x="540" y="127" fill="#FAFAFE">3</text><text x="748" y="127" fill="#FAFAFE">4</text><text x="124" y="199" fill="#FAFAFE">1</text><text x="332" y="199" fill="#FAFAFE">2</text><text x="540" y="199" fill="#FAFAFE">3</text><text x="748" y="199" fill="#FAFAFE">4</text></g><g font-weight="700"><text x="144" y="54">Task</text><text x="352" y="54">invokeAll</text><text x="560" y="54">get()</text><text x="768" y="54">Caller</text><text x="144" y="126">Task throws</text><text x="352" y="126">Future stores</text><text x="560" y="126">get() throws</text><text x="768" y="126">Caller fails</text><text x="144" y="198">Task</text><text x="352" y="198">invokeAll</text><text x="560" y="198">Caller</text><text x="768" y="198">Caller throws</text></g><g><text x="118" y="75">returns 1200</text><text x="326" y="75">batch completes</text><text x="534" y="75">returns 1200</text><text x="742" y="75">adds 1200</text><text x="742" y="95">full 5400: all ok</text><text x="118" y="147">IOException</text><text x="326" y="147">failure</text><text x="534" y="147">ExecutionException</text><text x="534" y="167">cause=IOException</text><text x="742" y="147">batch: no partial</text><text x="742" y="167">total</text><text x="118" y="219">still running</text><text x="326" y="219">timed deadline</text><text x="326" y="239">cancels it</text><text x="534" y="219">sees isCancelled</text><text x="742" y="219">TimeoutException</text></g><rect x="8" y="248" width="924" height="76" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><g><text x="20" y="272" font-weight="700" fill="#0066BB">Cancelled Future ≠</text><text x="20" y="294" font-weight="700" fill="#0066BB">worker stopped</text><text x="20" y="316">No proof task stopped</text><path d="M300 256V316" stroke="#B8B8C8" stroke-width="2" /><text x="316" y="272">interruption requested → cooperative exit</text><text x="316" y="294">→ executor close can complete</text><text x="316" y="316">Task ignores interruption: close may wait</text></g></svg>