<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="In the Java 21 case, a virtual thread blocks inside synchronized, keeping both the monitor and carrier thread C1 while runnable V2 needs an available carrier; fixes include shorter protected regions, ReentrantLock, and JDK 24 JEP 491, and a Semaphore of 2 separately bounds resource use." font-family="Inter,sans-serif"><defs><marker id="virtual-pinning-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><rect x="14" y="40" width="470" height="196" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="14" y="26" font-size="21" font-weight="700" fill="#1A1A2E">JDK 21 case: pinned carrier</text><rect x="30" y="56" width="120" height="44" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="42" y="85" font-size="18" fill="#1A1A2E">V1 on C1</text><rect x="30" y="170" width="120" height="44" rx="10" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="42" y="199" font-size="18" fill="#1A1A2E">V2 runnable</text><rect x="190" y="50" width="280" height="90" rx="10" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="204" y="78" font-size="18" fill="#1A1A2E">synchronized (lock) {</text><text x="220" y="104" font-size="18" fill="#1A1A2E">sleep()/block</text><text x="204" y="130" font-size="18" fill="#1A1A2E">}</text><path d="M150 78H186" stroke="#1A1A2E" stroke-width="2" marker-end="url(#virtual-pinning-ar-pjava02)"/><rect x="190" y="156" width="130" height="64" rx="10" fill="#FAFAFE" stroke="#FF6200" stroke-width="2"/><text x="200" y="184" font-size="18" fill="#1A1A2E">Monitor</text><text x="200" y="208" font-size="18" fill="#1A1A2E">owned</text><rect x="340" y="156" width="130" height="64" rx="10" fill="#FAFAFE" stroke="#FF6200" stroke-width="2"/><text x="350" y="184" font-size="18" fill="#1A1A2E">C1 kept</text><text x="350" y="208" font-size="18" fill="#1A1A2E">(pinned)</text><path d="M150 192H170V230H336V192H338" stroke="#7A7A8A" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#virtual-pinning-ar-pjava02)"/><circle cx="170" cy="62" r="11" fill="#1A1A2E"/><text x="170" y="68" font-size="18" text-anchor="middle" fill="#FAFAFE">1</text><circle cx="205" cy="146" r="0" fill="#1A1A2E"/><circle cx="176" cy="120" r="11" fill="#1A1A2E"/><text x="176" y="126" font-size="18" text-anchor="middle" fill="#FAFAFE">2</text><circle cx="452" cy="146" r="11" fill="#1A1A2E"/><text x="452" y="152" font-size="18" text-anchor="middle" fill="#FAFAFE">3</text><rect x="500" y="40" width="426" height="196" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="500" y="26" font-size="21" font-weight="700" fill="#1A1A2E">Fixes</text><text x="516" y="72" font-size="18" fill="#1A1A2E">• Block outside the monitor;</text><text x="530" y="96" font-size="18" fill="#1A1A2E">keep updates short</text><text x="516" y="128" font-size="18" fill="#1A1A2E">• Java 21: ReentrantLock</text><text x="530" y="152" font-size="18" fill="#1A1A2E">for blocking coordination</text><text x="516" y="184" font-size="18" fill="#1A1A2E">• JDK 24 JEP 491 removes</text><text x="530" y="208" font-size="18" fill="#1A1A2E">monitor pinning</text><text x="516" y="228" font-size="18" fill="#008866">Native pinning can remain.</text><rect x="14" y="252" width="912" height="66" rx="14" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="30" y="279" font-size="18" fill="#1A1A2E">Separate bound: cheap threads do not create connections.</text><text x="30" y="305" font-size="18" fill="#1A1A2E">Semaphore(2) gates 20 virtual tasks to 2 resource users.</text><text x="30" y="143" font-size="18" fill="#1A1A2E">C1 unavailable</text></svg>