<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="940" height="310" role="img" font-family="Inter,sans-serif" aria-labelledby="thread-parts-t-pjava02" aria-label="Diagram of Java thread parts: the caller creates an unstarted Thread from a Runnable task, new thread the worker body, the caller can call join while the worker is still running, join returns only after the worker terminates, and only then the caller reads the shared result."><title id="thread-parts-t-pjava02">Thread parts</title><defs><marker id="thread-parts-mo-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#C44E00"/></marker><marker id="thread-parts-mg-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#008866"/></marker><marker id="thread-parts-mp-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#5B41DF"/></marker><marker id="thread-parts-mn-pjava02" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7A7A8A"/></marker></defs><rect width="940" height="310" fill="#FAFAFE"/><text x="14" y="26" font-size="21" font-weight="700" fill="#1A1A2E">Thread parts: Runnable body, Thread object, join</text><rect x="14" y="44" width="290" height="210" rx="12" fill="#FAFAFE" stroke="#B8B8C8" stroke-width="2"/><g font-family="monospace" font-size="18" fill="#1A1A2E"><text x="54" y="76">Thread worker =</text><text x="54" y="100">  ...unstarted(task);</text><text x="54" y="128">worker.start();</text><text x="54" y="152">worker.join();</text><text x="54" y="176">result.get();</text></g><g fill="#1A1A2E"><circle cx="32" cy="70" r="12"/><circle cx="32" cy="122" r="12"/><circle cx="32" cy="146" r="12"/><circle cx="32" cy="170" r="12"/></g><g font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle"><text x="32" y="76">1</text><text x="32" y="128">2</text><text x="32" y="152">4</text><text x="32" y="176">4</text></g><rect x="26" y="188" width="266" height="28" rx="8" fill="#E6F4FF" stroke="#0091FF"/><circle cx="44" cy="202" r="12" fill="#1A1A2E"/><text x="44" y="208" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">3</text><text x="64" y="208" font-size="18" fill="#0066BB">task: Runnable object</text><rect x="26" y="220" width="266" height="28" rx="8" fill="#FFF4ED" stroke="#FF6200"/><circle cx="44" cy="234" r="12" fill="#1A1A2E"/><text x="44" y="240" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">1</text><text x="64" y="240" font-size="18" fill="#C44E00">worker = Thread object</text><rect x="320" y="36" width="466" height="86" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="332" y="58" font-size="18" font-weight="700" fill="#0066BB">CALLER</text><rect x="332" y="74" width="80" height="38" rx="8" fill="#FAFAFE" stroke="#7A7A8A"/><text x="372" y="99" font-size="18" fill="#1A1A2E" text-anchor="middle">create</text><rect x="424" y="74" width="80" height="38" rx="8" fill="#FAFAFE" stroke="#C44E00" stroke-width="2"/><text x="464" y="99" font-size="18" fill="#1A1A2E" text-anchor="middle">start</text><rect x="516" y="74" width="168" height="38" rx="8" fill="#FFF4ED" stroke="#FF6200" stroke-dasharray="6 4"/><text x="600" y="99" font-size="18" fill="#1A1A2E" text-anchor="middle">join waits</text><rect x="696" y="74" width="80" height="38" rx="8" fill="#FAFAFE" stroke="#5B41DF" stroke-width="2"/><text x="736" y="99" font-size="18" fill="#1A1A2E" text-anchor="middle">read</text><g fill="#1A1A2E"><circle cx="332" cy="74" r="12"/><circle cx="424" cy="74" r="12"/><circle cx="696" cy="74" r="12"/></g><g font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle"><text x="332" y="80">1</text><text x="424" y="80">2</text><text x="696" y="80">4</text></g><rect x="320" y="150" width="466" height="72" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="332" y="174" font-size="18" font-weight="700" fill="#008866">WORKER</text><rect x="530" y="170" width="120" height="40" rx="8" fill="#FAFAFE" stroke="#00C48C" stroke-width="2"/><text x="590" y="196" font-size="18" fill="#1A1A2E" text-anchor="middle">task.run()</text><circle cx="530" cy="170" r="12" fill="#1A1A2E"/><text x="530" y="176" font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle">3</text><path d="M464 112V190H526" fill="none" stroke="#C44E00" stroke-width="3" marker-end="url(#thread-parts-mo-pjava02)"/><text x="474" y="144" font-size="18" fill="#C44E00">new thread</text><path d="M650 190H684V116" fill="none" stroke="#008866" stroke-width="3" marker-end="url(#thread-parts-mg-pjava02)"/><text x="694" y="144" font-size="18" fill="#008866">ended</text><rect x="798" y="70" width="128" height="140" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="862" y="110" font-size="18" font-weight="700" fill="#1A1A2E" text-anchor="middle">shared</text><text x="862" y="134" font-size="18" font-weight="700" fill="#1A1A2E" text-anchor="middle">result</text><text x="862" y="170" font-size="18" fill="#5B41DF" text-anchor="middle">on heap</text><path d="M650 204H794" fill="none" stroke="#5B41DF" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#thread-parts-mp-pjava02)"/><text x="700" y="198" font-size="18" fill="#5B41DF">write</text><path d="M796 93H780" fill="none" stroke="#5B41DF" stroke-width="3" stroke-dasharray="6 4"/><path d="M798 93H780" stroke="#5B41DF" stroke-width="3" marker-end="url(#thread-parts-mp-pjava02)"/><g font-size="18" fill="#1A1A2E" text-anchor="middle"><rect x="330" y="228" width="60" height="26" rx="13" fill="#FAFAFE" stroke="#7A7A8A"/><text x="360" y="247">NEW</text><rect x="410" y="228" width="120" height="26" rx="13" fill="#FFF4ED" stroke="#FF6200"/><text x="470" y="247">RUNNABLE</text><rect x="550" y="228" width="140" height="26" rx="13" fill="#E6FAF3" stroke="#00C48C"/><text x="620" y="247">TERMINATED</text></g><path d="M392 241H408" stroke="#7A7A8A" stroke-width="2" marker-end="url(#thread-parts-mn-pjava02)"/><path d="M532 241H548" stroke="#7A7A8A" stroke-width="2" marker-end="url(#thread-parts-mn-pjava02)"/><text x="702" y="247" font-size="18" fill="#1A1A2E">start once</text><rect x="14" y="262" width="912" height="36" rx="10" fill="#FAFAFE" stroke="#B8B8C8" stroke-width="2"/><text x="28" y="286" font-size="18" fill="#1A1A2E">Direct task.run(): the calling thread runs the body; no new thread starts.</text></svg>