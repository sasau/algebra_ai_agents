<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Two-panel diagram: on the left, a cancelled Future while the task ignores the interrupt and keeps running; on the right, a cooperative task checks cancellation, exits through finally, and the caller uses bounded waits." font-family="Inter,sans-serif"><defs><marker id="future-stuck-ar-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><rect x="10" y="8" width="450" height="314" rx="14" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><rect x="480" y="8" width="450" height="314" rx="14" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="26" y="36" font-size="21" font-weight="700" fill="#C44E00">Ignored cancel (illustrative failure)</text><text x="496" y="36" font-size="21" font-weight="700" fill="#008866">Cooperative cancel</text><g font-size="18" fill="#1A1A2E"><circle cx="34" cy="68" r="12" fill="#1A1A2E"/><text x="34" y="74" text-anchor="middle" fill="#FAFAFE" font-size="18">1</text><text x="56" y="74">deadline reached</text><circle cx="34" cy="106" r="12" fill="#1A1A2E"/><text x="34" y="112" text-anchor="middle" fill="#FAFAFE">2</text><text x="56" y="112">Future.cancel(true)</text><circle cx="34" cy="144" r="12" fill="#1A1A2E"/><text x="34" y="150" text-anchor="middle" fill="#FAFAFE">3</text><text x="56" y="150">task ignores interrupt</text><circle cx="34" cy="182" r="12" fill="#1A1A2E"/><text x="34" y="188" text-anchor="middle" fill="#FAFAFE">4</text><text x="56" y="188">close() may keep WAITING</text></g><rect x="26" y="206" width="205" height="40" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="128" y="232" font-size="18" text-anchor="middle" fill="#1A1A2E">Future=CANCELLED</text><rect x="245" y="206" width="205" height="40" rx="10" fill="#FFF4ED" stroke="#C44E00" stroke-width="2"/><text x="347" y="232" font-size="18" text-anchor="middle" fill="#1A1A2E">task=STILL RUNNING</text><text x="26" y="276" font-size="18" fill="#1A1A2E">Cancelled state ≠ stopped task.</text><text x="26" y="304" font-size="18" fill="#1A1A2E">shutdownNow cannot force termination.</text><g font-size="18" fill="#1A1A2E"><circle cx="504" cy="68" r="12" fill="#1A1A2E"/><text x="504" y="74" text-anchor="middle" fill="#FAFAFE">1</text><text x="526" y="74">finite units, interruptible waits</text><circle cx="504" cy="106" r="12" fill="#1A1A2E"/><text x="504" y="112" text-anchor="middle" fill="#FAFAFE">2</text><text x="526" y="112">cancel requests interrupt</text><circle cx="504" cy="144" r="12" fill="#1A1A2E"/><text x="504" y="150" text-anchor="middle" fill="#FAFAFE">3</text><text x="526" y="150">exit via finally; release resources</text><circle cx="504" cy="182" r="12" fill="#1A1A2E"/><text x="504" y="188" text-anchor="middle" fill="#FAFAFE">4</text><text x="526" y="188">bounded wait, handle liveness</text></g><rect x="496" y="206" width="418" height="44" rx="10" fill="#FAFAFE" stroke="#0091FF" stroke-width="2"/><text x="512" y="234" font-size="18" fill="#1A1A2E">while (!interrupted) { work unit }</text><text x="496" y="276" font-size="18" fill="#1A1A2E">Timeout reports failure; it does not</text><text x="496" y="302" font-size="18" fill="#1A1A2E">prove the work stopped.</text></svg>