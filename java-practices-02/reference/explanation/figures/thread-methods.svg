<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-label="Three columns compare Thread.start, which spawns a worker while the caller continues, Thread.run, which is an ordinary same-stack call on an unstarted platform thread, and Thread.join, where the caller waits for worker termination before reading results." font-family="Inter,sans-serif"><defs><marker id="thread-methods-a1-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1A1A2E" /></marker></defs><rect width="940" height="340" fill="#FAFAFE" /><text x="470" y="26" font-size="21" font-weight="700" text-anchor="middle" fill="#1A1A2E">Thread methods: who runs, who waits</text><g font-size="18" fill="#1A1A2E"><rect x="12" y="40" width="296" height="288" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><rect x="322" y="40" width="296" height="288" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2" /><rect x="632" y="40" width="296" height="288" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2" /><text x="28" y="68" font-weight="700" fill="#C44E00">start</text><text x="338" y="68" font-weight="700" fill="#0066BB">run</text><text x="648" y="68" font-weight="700" fill="#008866">join</text><g font-family="monospace" font-size="18"><text x="28" y="96">public void start();</text><text x="338" y="96">public void run();</text><text x="648" y="96">public final void join()</text><text x="664" y="118">throws</text><text x="664" y="140">InterruptedException;</text></g><text x="28" y="130">1 caller: worker.start()</text><text x="338" y="130">1 caller: worker.run()</text><text x="648" y="166">1 caller: worker.join()</text><path d="M60 150V167H88" fill="none" stroke="#1A1A2E" stroke-width="2" marker-end="url(#thread-methods-a1-pjava02)" /><rect x="90" y="150" width="200" height="34" rx="8" fill="#FAFAFE" stroke="#C44E00" /><text x="100" y="173">2 worker: task.run()</text><line x1="60" y1="190" x2="60" y2="236" stroke="#1A1A2E" stroke-width="2" marker-end="url(#thread-methods-a1-pjava02)" /><text x="76" y="222">3 caller continues</text><text x="28" y="262">Execution order can vary.</text><text x="28" y="288">Second start throws</text><text x="28" y="310">IllegalThreadStateException</text><rect x="338" y="148" width="264" height="34" rx="8" fill="#FAFAFE" stroke="#0066BB" /><text x="348" y="171">2 caller: task.run()</text><text x="338" y="214">3 returns to caller</text><text x="338" y="250">No new worker starts.</text><text x="338" y="276">Unstarted platform</text><text x="338" y="300">Thread object only.</text><rect x="648" y="180" width="264" height="34" rx="8" fill="#FAFAFE" stroke="#008866" /><text x="658" y="203">2 caller WAITING</text><rect x="648" y="220" width="264" height="34" rx="8" fill="#FAFAFE" stroke="#008866" /><text x="658" y="243">3 worker terminates</text><text x="648" y="270">4 join returns, read result</text><text x="648" y="294">Interrupt: join throws;</text><text x="648" y="316">worker not cancelled.</text></g></svg>