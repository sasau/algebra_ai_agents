<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Timeline of six events: the caller starts the worker, calls join and waits, the worker stores lesson-worker and terminates, join returns, and the caller reads lesson-worker; a separate orange lane shows direct run executing on main." font-family="Inter,sans-serif" font-size="18"><defs><marker id="lifecycle-solution-arrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E" /></marker><marker id="lifecycle-solution-darrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B41DF" /></marker><marker id="lifecycle-solution-oarrow-pjava02" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44E00" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="24" font-size="20" font-weight="700" fill="#1A1A2E">start/join: six events, result = null at start</text><rect x="44" y="36" width="886" height="92" rx="12" fill="#FAFAFE" stroke="#B8B8C8" /><rect x="44" y="134" width="886" height="92" rx="12" fill="#FAFAFE" stroke="#B8B8C8" /><text transform="rotate(-90 30 82)" x="30" y="88" text-anchor="middle" font-weight="700" fill="#0066BB">CALLER</text><text transform="rotate(-90 30 180)" x="30" y="186" text-anchor="middle" font-weight="700" fill="#008866">WORKER</text><rect x="200" y="40" width="444" height="84" rx="10" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2" /><text x="487" y="78" text-anchor="middle" font-weight="700" fill="#5B41DF">WAITING</text><text x="487" y="104" text-anchor="middle" fill="#1A1A2E">blocked in join()</text><g fill="#E6F4FF" stroke="#0091FF" stroke-width="2"><rect x="52" y="46" width="130" height="72" rx="10" /><rect x="200" y="46" width="130" height="72" rx="10" /><rect x="644" y="46" width="130" height="72" rx="10" /><rect x="792" y="46" width="130" height="72" rx="10" /></g><g fill="#E6FAF3" stroke="#00C48C" stroke-width="2"><rect x="348" y="140" width="130" height="80" rx="10" /><rect x="496" y="140" width="130" height="80" rx="10" /></g><g fill="#1A1A2E" text-anchor="middle"><text x="117" y="78">start()</text><text x="117" y="100">worker starts</text><text x="265" y="78">join() CALL</text><text x="265" y="100" font-weight="700">WAITING</text><text x="413" y="168">store result</text><text x="413" y="190">null →</text><text x="413" y="212">lesson-worker</text><text x="561" y="186">worker</text><text x="561" y="208" font-weight="700">terminated</text><text x="709" y="78">join RETURNS</text><text x="709" y="100">caller runs</text><text x="857" y="78">result.get()</text><text x="857" y="100">lesson-worker</text></g><g fill="#1A1A2E"><circle cx="52" cy="46" r="13" fill="#1A1A2E" /><circle cx="200" cy="46" r="13" fill="#1A1A2E" /><circle cx="348" cy="140" r="13" fill="#1A1A2E" /><circle cx="496" cy="140" r="13" fill="#1A1A2E" /><circle cx="644" cy="46" r="13" fill="#1A1A2E" /><circle cx="792" cy="46" r="13" fill="#1A1A2E" /></g><g fill="#FAFAFE" font-weight="700" text-anchor="middle"><text x="52" y="52" fill="#FAFAFE">1</text><text x="200" y="52" fill="#FAFAFE">2</text><text x="348" y="146" fill="#FAFAFE">3</text><text x="496" y="146" fill="#FAFAFE">4</text><text x="644" y="52" fill="#FAFAFE">5</text><text x="792" y="52" fill="#FAFAFE">6</text></g><g stroke="#1A1A2E" stroke-width="2" fill="none" marker-end="url(#lifecycle-solution-arrow-pjava02)"><path d="M182 82H198" /><path d="M478 180H494" /><path d="M774 82H790" /><path d="M117 118V180H346" /></g><text x="132" y="172" fill="#1A1A2E">starts</text><path d="M626 190H709V120" fill="none" stroke="#5B41DF" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#lifecycle-solution-darrow-pjava02)" /><text x="722" y="178" fill="#1A1A2E">changes visible after</text><text x="722" y="200" fill="#1A1A2E">join RETURN</text><rect x="44" y="236" width="886" height="88" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2" /><g fill="#FAFAFE" stroke="#FF6200" stroke-width="2"><rect x="56" y="247" width="270" height="66" rx="10" /><rect x="346" y="247" width="270" height="66" rx="10" /><rect x="636" y="247" width="270" height="66" rx="10" /></g><g fill="#1A1A2E"><text x="68" y="275" font-weight="700">A worker.run()</text><text x="68" y="299">separate unstarted Thread</text><text x="358" y="275" font-weight="700">B task records</text><text x="358" y="299">Thread = main</text><text x="648" y="275" font-weight="700">C returns on main</text><text x="648" y="299">no new thread starts</text></g><g stroke="#C44E00" stroke-width="2" marker-end="url(#lifecycle-solution-oarrow-pjava02)"><path d="M326 280H344" /><path d="M616 280H634" /></g></svg>