<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Five philosophers each first hold their own fork, then each requests the next fork held by a neighbour, forming a circular wait-for cycle P0 to P1 to P2 to P3 to P4 to P0 where nobody can eat." font-family="Inter,sans-serif"><defs><marker id="deadlock-arrow-pjava02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44E00" /></marker><marker id="deadlock-order-pjava02" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7A7A8A" /></marker></defs><rect width="940" height="330" fill="#FAFAFE" /><text x="14" y="26" font-size="20" font-weight="700" fill="#1A1A2E">Deadlock: five-philosopher circular wait (Pi needs Fi, F(i+1)%5)</text><circle cx="88" cy="56" r="12" fill="#1A1A2E" /><text x="88" y="62" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">1</text><text x="108" y="62" font-size="18" font-weight="700" fill="#1A1A2E">ACQUIRE FIRST</text><circle cx="314" cy="56" r="12" fill="#1A1A2E" /><text x="314" y="62" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">2</text><text x="334" y="62" font-size="18" font-weight="700" fill="#1A1A2E">REQUEST SECOND</text><circle cx="604" cy="56" r="12" fill="#1A1A2E" /><text x="604" y="62" font-size="18" font-weight="700" text-anchor="middle" fill="#FAFAFE">3</text><text x="624" y="62" font-size="18" font-weight="700" fill="#1A1A2E">WAIT-FOR CYCLE</text><g stroke-width="2"><rect x="14" y="76" width="50" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF" /><rect x="74" y="76" width="180" height="36" rx="8" fill="#E6F4FF" stroke="#0066BB" stroke-width="3" /><rect x="300" y="76" width="272" height="36" rx="8" fill="#FFF4ED" stroke="#C44E00" stroke-dasharray="7 5" /><rect x="14" y="120" width="50" height="36" rx="8" fill="#F0EDFF" stroke="#7B61FF" /><rect x="74" y="120" width="180" hei