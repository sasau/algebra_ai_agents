<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-label="Left: in a one-worker pool the parent task holds the only worker while waiting for a child queued in the same pool, so the child can never run. Right: the caller submits independent child tasks, the worker runs them and completes futures, and the caller combines results outside the pool." font-family="Inter,sans-serif"><defs><marker id="executor-starvation-a-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1A1A2E"/></marker><marker id="executor-starvation-o-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#C44E00"/></marker><marker id="executor-starvation-g-pjava02" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#008866"/></marker></defs><rect width="940" height="330" fill="#FAFAFE"/><line x1="470" y1="50" x2="470" y2="320" stroke="#B8B8C8" stroke-width="2"/><text x="20" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Starved: nested submit + get</text><text x="490" y="28" font-size="21" font-weight="700" fill="#1A1A2E">Repair: caller waits outside</text><rect x="20" y="52" width="210" height="116" rx="12" fill="#FFF4ED" stroke="#FF6200" stroke-width="2"/><text x="36" y="82" font-size="18" font-weight="700" fill="#1A1A2E">Worker W (only)</text><text x="36" y="108" font-size="18" fill="#1A1A2E">runs parent</text><text x="36" y="134" font-size="18" fill="#1A1A2E">parent: get()</text><text x="36" y="156" font-size="18" fill="#C44E00">W blocked</text><rect x="260" y="52" width="190" height="116" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="276" y="82" font-size="18" font-weight="700" fill="#1A1A2E">Pool queue</text><rect x="276" y="98" width="158" height="54" rx="8" fill="#FAFAFE" stroke="#0066BB" stroke-width="2"/><text x="290" y="132" font-size="18" fill="#1A1A2E">child waits</text><path d="M230 126H258" stroke="#1A1A2E" stroke-width="3" marker-end="url(#executor-starvation-a-pjava02)" fill="none"/><path d="M355 168V196H125V170" stroke="#C44E00" stroke-width="3" fill="none" marker-end="url(#executor-starvation-o-pjava02)"/><text x="145" y="224" font-size="18" fill="#C44E00">child needs W</text><rect x="20" y="244" width="430" height="70" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="36" y="272" font-size="18" fill="#1A1A2E">Cycle: parent waits child result →</text><text x="36" y="298" font-size="18" fill="#1A1A2E">child needs worker → parent holds W</text><circle cx="30" cy="62" r="0" fill="none"/><g font-size="18" font-weight="700" fill="#FAFAFE" text-anchor="middle"><circle cx="212" cy="70" r="12" fill="#1A1A2E"/><text x="212" y="76">1</text><circle cx="245" cy="118" r="0"/><circle cx="424" cy="68" r="12" fill="#1A1A2E"/><text x="424" y="74">2</text><circle cx="212" cy="150" r="12" fill="#1A1A2E"/><text x="212" y="156">3</text><circle cx="418" cy="190" r="12" fill="#1A1A2E"/><text x="418" y="196">4</text></g><rect x="490" y="52" width="170" height="116" rx="12" fill="#F0EDFF" stroke="#7B61FF" stroke-width="2"/><text x="506" y="82" font-size="18" font-weight="700" fill="#1A1A2E">Caller</text><text x="506" y="110" font-size="18" fill="#1A1A2E">submit kids</text><text x="506" y="136" font-size="18" fill="#1A1A2E">then get()</text><rect x="690" y="52" width="230" height="116" rx="12" fill="#E6F4FF" stroke="#0091FF" stroke-width="2"/><text x="706" y="82" font-size="18" font-weight="700" fill="#1A1A2E">Pool: queue + W</text><text x="706" y="116" font-size="18" fill="#1A1A2E">W runs child</text><text x="706" y="144" font-size="18" fill="#1A1A2E">Future completes</text><path d="M660 98H688" stroke="#1A1A2E" stroke-width="3" marker-end="url(#executor-starvation-a-pjava02)" fill="none"/><path d="M805 168V198H575V170" stroke="#008866" stroke-width="3" fill="none" marker-end="url(#executor-starvation-g-pjava02)"/><text x="600" y="224" font-size="18" fill="#008866">result completes</text><rect x="490" y="244" width="430" height="70" rx="12" fill="#E6FAF3" stroke="#00C48C" stroke-width="2"/><text x="506" y="272" font-size="18" fill="#1A1A2E">Or run needed work directly.</text><text x="506" y="298" font-size="18" fill="#1A1A2E">More threads is not a proof.</text></svg>